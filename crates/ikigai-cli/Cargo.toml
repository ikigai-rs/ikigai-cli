[package]
name = "ikigai-cli"
description = "ikigai — a REPL client for resource-resolution kernels (native + WebAssembly)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ikigai"
path = "src/main.rs"

[features]
default = ["embedded", "ipc"]
embedded = ["dep:ikigai-embedded"]
ipc = ["dep:ikigai-ipc"]   # Unix only; the dep is empty elsewhere
quic = ["dep:ikigai-quic", "dep:ikigai-discovery", "dep:ikigai-wire"] # opt-in; pulls quinn/rustls/tokio
web = ["dep:ikigai-web", "dep:tokio", "dep:serde_yaml", "dep:tokio-rustls", "dep:ikigai-fs"] # opt-in inbound HTTP face; pulls Tokio (like quic). With `quic` too, it also opens a layer door's HTTPS front (`--layers-https`), whose TLS is tokio-rustls

# The durable RDF store (`urn:iki:store:*`) and the work ledger that rides on it. Opt-in
# like `quic` and `web`, and it implies `embedded` because the store is bound in the
# embedded root space and nowhere else — a served kernel must not hand a remote caller a
# dataset whose write scope is `DROP ALL`.
#
# ⚠ Turning this feature on does NOT open a dataset. A `store = true` line in the config
# home has to name this instance as well, because the directory can only be held by one
# process at a time — `ikigai-embedded/src/store.rs` and `docs/durable-store.md` argue it.
# Install it with: cargo install --locked --features store --path crates/ikigai-cli
store = ["embedded", "ikigai-embedded/store"]

[dependencies]
async-trait = "0.1"
ikigai-core = { workspace = true }
# Sibling crates carry an explicit version — a path-only dependency is unpublishable.
# The number is the LOCKSTEP version, NOT a floor: these siblings are released together at
# one version, so same-version-across-the-set is the only combination anything has ever
# packaged, published or tested. A floor would name a combination CI has never built, and
# no local build could contradict it — in-tree the path dependency always wins, so the
# version half is never exercised here. The full argument, and why this is constitution
# rule 5 APPLIED rather than broken, lives in the root manifest's `[workspace.dependencies]`.
# The per-pin notes below stay as API HISTORY: they record which release first carried the
# API named, which is what a reader needs when asking whether an older sibling would compile
# at all. They no longer set the number. `tests/lockstep_pins.rs` fails if any of them falls
# out of step with `workspace.package.version` — five of the sixteen sibling pins a lockstep
# bump has to touch are in this file.
# `plan-reader` is the `execute <spec>` half of the plan face: it is off by default so the
# engine still compiles to wasm32 (see that crate's [features]), and a host that is not a
# browser wants it. The workspace entry turns it on. A registry crate since 0.1.70, from
# github.com/ikigai-rs/ikigai-engine, so it is no longer a lockstep pin.
ikigai-engine = { workspace = true } # API history — 0.1.16 = with_width_routing + last_fan_out: the fan-out switch and the note the REPL prints
ikigai-resolve = { workspace = true }
serde_json = { workspace = true }
ikigai-embedded = { path = "../ikigai-embedded", version = "0.2.8", optional = true } # API history — 0.1.16 = set_width_routing/width_routing: the --width-routing channel, beside set_scheduler_spec
ikigai-mcp = { path = "../ikigai-mcp", version = "0.2.8" } # API history — 0.1.12 = row collapse: every same-named manifold row stays reachable
ikigai-ipc = { path = "../ikigai-ipc", version = "0.2.8", optional = true } # API history — 0.1.13 = heal-on-use: a broken established connection redials
ikigai-quic = { path = "../ikigai-quic", version = "0.2.8", optional = true } # API history — 0.1.14 = the
# first published quic carrying `Minter`, `PeerIdentity` and `fingerprint_of_pem` (#286,
# per-identity grants), all three named in main.rs. The pin read 0.1.6 — a version that
# EXISTS on crates.io and does not have them, so the claim was false in the one direction a
# resolver can actually take. No local build could ever have contradicted it.
# mDNS announce/browse. Rides the `quic` feature: the only thing worth finding on the
# network is a QUIC-served kernel.
ikigai-discovery = { path = "../ikigai-discovery", version = "0.2.8", optional = true }
ikigai-wire = { workspace = true, optional = true }
# Inbound HTTP face — published as `ikigai-web`; this workspace owns that crates.io name
# (the standalone server repo of the same directory name publishes as `ikigai-web-server`).
# Gated behind `web`.
ikigai-web = { workspace = true, optional = true }
# The HTTP door's spill (ledger #2244): ikigai-fs's file-backed `FileSpill`, over a directory
# under the config home, so an upload route can take a body larger than memory. Gated behind
# `web`; `FileSpill` itself is Unix only.
ikigai-fs = { workspace = true, optional = true }
# A runtime for the `web` serve loop (ikigai-web is async). Feature-gated so the
# default/wasm binary never pulls Tokio; matches the `quic` transport's posture.
# net+time so the runtime's `enable_all()` has the io+time drivers on its own.
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util"], optional = true }
# The layers HTTPS front's TLS (`src/front.rs`), over the rustls ikigai-quic already links: the
# server config is ikigai-quic's (`https_server_tls`, ring, the door's own certificate), so no
# second crypto provider is chosen here. `tls12` because an HTTP client on an older runtime may
# speak only TLS 1.2.
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12"], optional = true }
# YAML authoring of the non-LD route table (parses to the same value tree as JSON). Only the
# `web`-featured loader uses it. (serde_yaml 0.9 is archived-but-stable; swap to serde_yml if
# a maintained fork is preferred.)
serde_yaml = { version = "0.9", optional = true }
# `ikigai layers post|save` (`src/layer.rs`, ledger #1629): a file entry's SHA-256, its media
# type guessed from its name, and the Turtle a door answers parsed back to check a saved file's
# digest. All already in this workspace's graph; none needs a feature. oxttl and oxrdf come from
# the workspace, which pins oxrdf to the version oxttl's triples are from. A file entry's base64
# is `ikigai_http::base64` (below), not the `base64` crate directly (ledger #1866).
sha2 = "0.10"
mime_guess = "2.0"
# The ecosystem's one `Authorization` reader and base64 (ledger #1857): the layers front's
# `bearer()` reads its header through `ikigai_http::auth::scheme`, the clipboard's OSC-52 payload
# is `ikigai_http::base64::encode`, and a layer file entry's content is encoded and decoded by the
# same module (ledger #1866), so none carries a private copy. 0.2.1 is
# the first release with the `auth` and `base64` modules, so 0.2.1 was this crate's floor; 0.3.0 is
# the workspace's now (ledger #1546, the failure classes), and the two modules are unchanged in it.
# 0.4.0 = the core 0.2.0 sweep (ledger #2356): the newest release, on ikigai-core 0.2.x.
# 0.4.1 adds the configurable endpoint response budget; use the workspace minimum.
ikigai-http = { workspace = true }
oxttl = { workspace = true }
oxrdf = { workspace = true }
# `layers save` refuses a file name that would arm something on the reader's machine, by the
# Python client's rule (ledger #1748): a configuration name is compared after NFKC and full case
# folding, and an invisible character is one of general category Cf, Zl or Zp. The three ICU4X
# crates the workspace's graph already holds (steel-core's icu_casemap, idna's icu_normalizer and
# icu_properties), so nothing new is resolved, with only their compiled data. The pin is 2.3, the
# version this lock resolves and the only one any build here has compiled: the calls used
# (`ComposingNormalizer::new_nfkc`, `CaseMapper::new().fold_string`, `CodePointMapData::new`)
# may well exist from 2.0, but nothing has built that, so the floor does not claim it. A 2.x
# caret has no 0.x ceiling.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }

# The full-screen TUI is native-only (crossterm). The browser frontend (ratzilla)
# lands in a later slice; on wasm the binary falls back to the line REPL.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Count wrapped runbook rows with the same algorithm used to render them.
ratatui = { version = "0.30.1", features = ["unstable-rendered-line-info"] }
crossterm = "0.29.0"

# `poll` and `FIONREAD` on stdin, so a `-c` batch can tell a stdin that is already at its end
# with nothing (a closed empty pipe) from one with bytes waiting, WITHOUT reading it (ledger
# #1305; see `stdin_ended_empty` in main.rs).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# `layers save` with no PATH on Windows, when there is no `~\Downloads`: the Downloads known
# folder (`dirs::download_dir`, SHGetKnownFolderPath), as the Python client reads it from the
# registry (ledger #1748). Already in the graph (rudof_config's), so nothing new is resolved;
# 6.0 is the version this lock holds.
[target.'cfg(windows)'.dependencies]
dirs = "6.0"

# `build.rs` reads the lock this build resolved against and records the `ikigai-*` crates the
# binary links, for `--version --verbose` (ledger #1338). The same parser the lockstep test uses.
[build-dependencies]
toml = "0.8"

[dev-dependencies]
# `block_on` for the one assertion the adapter cannot make: issuing the step's request at
# the KERNEL, under the session's own capability, to see the TYPED `Denied` — the engine's
# `Entry.result` is `Result<String, String>`, so the taxonomy reaches a face as prose only.
futures = { workspace = true }
# Read this workspace's own manifests back in `tests/lockstep_pins.rs`. A real TOML parse
# rather than line matching: the invariant must hold for a dependency written as an inline
# table, a `[dependencies.x]` table or a target-gated one, and a hand-rolled scan that
# silently skips a form it does not recognize is a guard that passes by not looking.
toml = "0.8"
# `tests/layers_serve.rs` enrolls its participants with the layer host's OWN generator
# (`ikigai_layers::grants`, the library behind `ikigai-layers grants <config dir>`), so the test
# proves the door serves the pair of files that generator writes, not a hand-copied imitation.
ikigai-layers = { workspace = true }
# The layer suites mint a throwaway age identity for `serve --layers-key` (ikigai-layers 0.3.0
# seals its state to one), as `age-keygen -o` would; never a key checked into the tree.
age = { workspace = true }
# `tests/layers_serve.rs` signs decision, block and label links the way the Mac and the edge do
# (Ed25519 over the link's payload), so the layer-door surface test can show that a participant
# holding a VALID link is still refused by its own capability, not only by a door with no key
# (ledger #1688). The same requirement and features as ikigai-embedded's, so no second copy.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem"] }
# `tests/layers_serve.rs` mints signed links in base64url WITHOUT padding (RFC 4648 §5), which
# `ikigai_http::base64` does not expose yet (it is the standard alphabet only), so the test reaches
# the vetted crate directly. Test-only: the shipped code's one base64 is `ikigai_http::base64`.
base64 = "0.22"
# `route_load.rs`'s tests run the route query through the real `urn:sparql:select`, as the loader
# does in the binary, because what an aggregate does with an IRI `ik:cap` is the query's behavior,
# not the parser's (ledger #30). Already in the graph through ikigai-embedded; no new package.
ikigai-sparql = { workspace = true }
# `tests/intake_envelope.rs` builds an intake and reads its contract through the two projections
# that meet here, MCP's input schema and ikigai-web's OpenAPI (ledger #1885). Already in the graph
# through ikigai-embedded, and published before this crate in the lockstep release.
ikigai-intake = { workspace = true }
