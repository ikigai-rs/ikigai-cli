[package]
name = "ikigai-intake"
description = "Public form intake: parse an untrusted urlencoded/JSON submission, validate it against declared fields, and drop it into a tuplespace as an escaped s-expression. The front door for contact enquiries and booking requests."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
# `ikigai_fn::html`: the redirect shim escapes and checks its URL with the shared rule (ledger #1868).
ikigai-fn = { workspace = true }
# Keyed BLAKE3: a configured blocklist is asked by a keyed hash of the sender, never the address (ledger #3685).
blake3 = "1"
async-trait = "0.1"
serde_json = { workspace = true }
# The IANA time-zone database, so a submitted zone is checked against real tzdata at the
# door rather than trusted and blown up on later. Already in the tree via ikigai-tz.
chrono-tz = "0.10"

[dev-dependencies]
futures = { workspace = true }
