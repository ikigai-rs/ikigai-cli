[package]
name = "ikigai-intray"
description = "The intray as a tuplespace: urn:space:{name} — Sink drops a tuple (out), Source lists/reads/filters (rd), Delete atomically takes one (in), associative match via SPARQL ASK. A physical, capability-gated space; later slices add the reactive engine and encrypt-on-drop."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
# The reactor fires a space's handler by resolving it through a kernel handle — held
# behind the Resolver trait (like the time transport's JobRegistry), installed after the
# kernel is built. The handler runs under the reactor's OWN configured capability, never
# the dropper's.
ikigai-resolve = { workspace = true }
# The live watcher fires the reactor on each drop — the same fs-notify the embedded host
# already uses for golden-thread freshness. Native/embedded-only, like the rest of this crate.
notify = "6"
async-trait = "0.1"
# Content-addressed tuple ids (same hash family core uses for content addressing).
blake3 = "1"
# Associative match: a tuple's graph is loaded and tested against a SPARQL ASK. Already
# in the build graph via ikigai-sparql; the space is embedded-only — nothing serves it over
# the wire — so the heavy Oxigraph dependency is acceptable here. (The crate itself has been
# published since 0.1.14; it was `publish = false` until #296.)
oxigraph = "0.5"
# The `match=` template is parsed to ALGEBRA so a `SERVICE` clause can be refused wherever it
# hides (a `FILTER EXISTS`, an `OPTIONAL`, a sub-select) rather than by scanning text (audit
# round 5, ledger #877); the walk itself is `ikigai_store::service::refuse_service`, which takes
# spargebra's `Query`. The same version oxigraph pins exactly (it re-exports none of these
# types), so this adds no crate to the graph. `sep-0006` stays named here: the store enables it
# for its own walk, and this crate parses the `LATERAL` the walk is written to cover.
spargebra = { version = "0.4", features = ["sep-0006"] }
# The bound on caller SPARQL (ledger #963): `limits::check_sparql` refuses a `match=` template
# over 1 MiB or nested past 64 levels before it is parsed, and `limits::on_sparql_stack` parses
# and evaluates it on a stack sized for its text — the same two layers the store's own doors
# and `urn:sparql:*` use. 0.2.7 is the first release with `limits`. No features: `persistent`
# (RocksDB) is the host's to enable, and this crate opens no store.
# ⚠ 0.2.10 is an API floor (ledger #1085): `ikigai_store::service` — the refusing evaluator
# (`service::evaluator`) and the algebra walk (`service::refuse_service`) every `match=` goes
# through — exists only from 0.2.10. This crate carried its own copy of both (ledger #877) until
# then, and that copy is gone.
# ⚠ 0.2.11 is an API floor (ledger #1108): `service::refuse_service_with` refuses with the
# store's shared `SERVICE_REFUSAL` sentence followed by THIS crate's remedy, never the store's
# own (`urn:iki:store:load`, which means nothing to a match). It exists only from 0.2.11.
# 0.2.12 is taken with the root's (ledger #1127, the writer-thread perf fix) so the two pins
# cannot resolve apart off-tree; the API floor above is unchanged.
ikigai-store = "0.2.12"

[dev-dependencies]
futures = { workspace = true }
# oxigraph's HTTP `SERVICE` client, ON for this crate's tests. The host build already has it
# by feature unification (rudof, through ikigai-shacl, enables `http-client-rustls-native`), so
# a test built without it would guard a quieter configuration than the one that ships: a
# `SERVICE` clause in `match=` simply fails there and no connection is ever attempted
# (audit round 5, ledger #877).
oxigraph = { version = "0.5", features = ["http-client"] }
# The REAL engine, for the take-by-content tests: `delete urn:space:q <id>` is built by the
# engine's write path, and a hand-built request would only restate what we believe it sends.
# serde_json renders the Meta the engine reads to route named arguments (without a JSON Meta
# renderer the engine fails open and a routing defect is invisible — field guide).
ikigai-engine = { path = "../ikigai-engine", version = "0.1.46" }
serde_json = { workspace = true }
