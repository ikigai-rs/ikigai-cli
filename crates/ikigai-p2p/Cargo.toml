[package]
name = "ikigai-p2p"
description = "SPIKE: the ikigai wire protocol over libp2p — relayed reachability and hole punching for a peer off the LAN."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# A design spike, not a transport anyone should depend on yet: see
# docs/design/p2p-mobility-design.md. Unpublished, so the lockstep release neither ships it
# nor has to bump for it — a new member that publishes nothing changes no published version.
publish = false

[features]
default = []
# Everything is behind `p2p`: without it this crate is EMPTY, so the default workspace build
# compiles no libp2p. CI's `features: "*"` turns it on, which is what lints and tests it and
# builds the examples below (9c: their `required-features` would otherwise hide them).
p2p = [
    "dep:libp2p",
    "dep:ikigai-core",
    "dep:ikigai-quic",
    "dep:ikigai-wire",
    "dep:tokio",
    "dep:futures",
]

[dependencies]
ikigai-core = { workspace = true, optional = true }
# For `Session` and `dispatch` — the server half of capability-on-the-wire, shared rather
# than copied. The TRUE floor is 0.1.22 — `dispatch` became public in #332 and 0.1.22 shipped it
# (published 2026-09-15); 0.1.21 does not have it. The number here is the LOCKSTEP version, which
# is higher; `publish = false` means nothing outside this workspace ever resolves it anyway.
ikigai-quic = { path = "../ikigai-quic", version = "0.1.26", optional = true }
ikigai-wire = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "time", "sync"], optional = true }
# 0.57.0 is the floor AND the ceiling: the builder's `with_relay_client` after `with_quic`,
# `request_response::Event::Message::connection_id`, and `ConnectedPoint::is_relayed` are
# what this code calls, and ⚠ `"0.57.0"` means `>=0.57.0, <0.58.0` — libp2p breaks at every
# minor, so moving past 0.57 is a deliberate edit to this line, never a resolve.
#
# ⚠ BUILD COST: `quic` and `tls` pull `aws-lc-rs`/`aws-lc-sys` (a C build) unconditionally —
# libp2p-quic 0.14 enables quinn's `rustls-aws-lc-rs` and libp2p-tls 0.7 enables rustls's
# `aws-lc-rs`. `ikigai-quic` chose `ring` precisely to avoid that toolchain. See the design
# note for the measured cost. NO `mdns` feature, ever: `ikigai-discovery` is the one LAN
# responder on a machine (cli #331 was two responders claiming one name).
libp2p = { version = "0.57.0", default-features = false, optional = true, features = [
    "tokio",
    "quic",
    "tls",
    "yamux",
    "ed25519",
    "macros",
    "identify",
    "ping",
    "relay",
    "dcutr",
    "request-response",
] }

[dev-dependencies]
# The host's own `clients.json`/`grants.json` reader, so a test proves a PeerId is
# authorized by the SAME table as a certificate fingerprint rather than by a lookalike.
ikigai-embedded = { path = "../ikigai-embedded", version = "0.1.26" }

# The off-LAN trial binaries. Run them with `--features p2p`; see the design note.
[[example]]
name = "p2p-relay"
required-features = ["p2p"]

[[example]]
name = "p2p-serve"
required-features = ["p2p"]

[[example]]
name = "p2p-call"
required-features = ["p2p"]
