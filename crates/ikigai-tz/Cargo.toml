[package]
name = "ikigai-tz"
description = "Timezone conversion module: urn:tz:convert (IANA/DST-correct) + urn:tz:now (zoned clock)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
# Datetime arithmetic + RFC 3339 parse/format. `clock` for Utc::now/Local; no serde.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The IANA time-zone database (bundled) — DST- and offset-correct conversions.
chrono-tz = "0.10"

[dev-dependencies]
futures = { workspace = true }
# The module recipe as one test (`tests/conformance.rs`). 0.8.0 is the floor for REQUIRED,
# which found `urn:tz:convert` refusing a missing `in` untyped (fixed in `src/lib.rs`); 0.6.0
# brought SPACE-NAME, the check that `space()` claims `urn:iki:space:tz` over the same doors
# on every call. ⚠ `^0.8.0` is also a ceiling below 0.9.0.
# 0.9.0 (ledger #1547): REQUIRED probes input groups through `ActionSpec::check`, OUTPUTS honors `output_from`,
# open argument sets and empty enumerations are understood. ⚠ `^0.9.0` is also a ceiling below 0.10.0.
# 0.9.1 (ledger #1882): VALIDATE's hint allows an optional binding's default (core 0.1.106). Not an API floor.
# ⚠ `^0.9.1` is also a ceiling below 0.10.0.
# 0.10.0 (ledger #1546): the FAILURES check (declared failure classes = produced, core 0.1.108's
# `ActionSpec::fails` over `Error::class()`), opt-in through `Suite::check_failures()` in 0.10 and the
# default from 0.11.0; `Suite::fails_under` probes. ⚠ `^0.10.0` is also a ceiling below 0.11.0.
# 0.11.0 (ledger #2356): the release on ikigai-core 0.2.0; DATATYPES and FAILURES run by default.
# ⚠ `^0.11.0` is also a ceiling below 0.12.0.
ikigai-conformance = "0.11.0"
