[package]
name = "ikigai-passkey"
description = "A minimal single-user WebAuthn (ES256) assertion verifier: check a passkey assertion against one registered credential — origin, RP-ID, challenge, user-presence, monotonic sign-count, and the ECDSA-P256 signature over authenticatorData ‖ SHA256(clientDataJSON). No user database and no attestation trust; the enrollment context is the trust anchor. The second factor on the edge's decision links."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Published from 0.1.14 despite the caution this line used to carry — the verifier had not been
# exercised against a live device, and the challenge/session endpoints had not settled. Neither
# is resolved; what changed is that holding it back stopped being free. ikigai-embedded depends
# on this crate, and a path-only dependency with no version makes EVERY crate above it in the
# workspace unpublishable — including the ikigai binary itself, which had been silently
# unreleasable since July because of it. A 0.x version already promises nothing about stability,
# which is the honest place for something still settling.

[dependencies]
# ES256 (ECDSA over NIST P-256) is what Apple, Android and Windows platform authenticators
# emit by default; `pem` pulls SPKI/PKCS8 so a registered public key can arrive as DER.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
serde_json = { workspace = true }
