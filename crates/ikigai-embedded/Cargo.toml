[package]
name = "ikigai-embedded"
description = "In-process transport: composes a kernel directly in the host process."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
# The durable RDF store (`urn:iki:store:*`) and, riding on it, the work ledger. Opt-in
# twice over: this feature has to be on for the code to exist, and a `store = true` line
# in the config home has to name THIS instance for a dataset to be opened. See
# `src/store.rs` for why the second switch exists (one writer per directory).
#
# ⚠ There is no `required-features` target behind this — it is a `cfg(feature)` path
# inside a LIBRARY, which `--all-targets` cannot see and `ci-drift`'s check cannot
# report. What covers it is the caller's `features: "*"` input in `.github/workflows/
# ci.yml`, which runs clippy and test under `--all-features` on Linux and macOS. Removing
# that input silently stops linting and testing everything below.
#
# ⚠ ONE feature for BOTH crates, not two. The ledger owns no bytes: every read it makes is
# a scoped SPARQL query at `urn:iki:store:graph-select` and every write a scoped UPDATE at
# `urn:iki:store:graph-update`, so a ledger space bound without a store space beside it is
# a set of resources that resolve and then fail. A `ledger` feature that could be enabled
# without `store` would be a switch whose only reachable off-nominal state is a host that
# is broken in a way no test of either crate alone can see.
store = ["dep:ikigai-store", "dep:ikigai-ledger"]

[dependencies]
# `declare` = `Topology::from_turtle`: this host reads a declared arrangement for its local root
# (`--arrangement`, `arrangement = …`; ledger #637). Enabled HERE only, in the native host crate
# that reads one — a wasm face (ikigai-engine, checked for wasm32 in its own repo's CI) never selects this crate, so it never
# pulls the parser; one that did would need `--cfg getrandom_backend="wasm_js"` (see core's manifest).
ikigai-core = { workspace = true, features = ["declare"] }
# `clock_gettime` on the two clock pairs that measure machine sleep (see `HostSleepClock`).
libc = { workspace = true }
ikigai-vocab = { workspace = true }
ikigai-fn = { workspace = true }
ikigai-personal = { workspace = true }
ikigai-org = { workspace = true }
# The consolidated-view (Brian-Busy) derivation, lifted out of this host crate into
# its own focused, independently-tested crate. This host merely binds its endpoints
# (urn:view:derive[:tick], urn:view:ingest), passing the resolved calendar config.
ikigai-view = { workspace = true }
ikigai-text = { workspace = true }
ikigai-cms = { workspace = true }
ikigai-repo = { workspace = true }
# Steel-backed Lisp evaluator (urn:lisp:eval) — bound into the embedded/native
# host space only (it evaluates arbitrary code), cap-gated by urn:cap:lisp.
ikigai-lisp = { workspace = true }
# The Timeout interception overlay fronting urn:lisp:eval on every SERVED surface
# (wire-eval L1's wall-clock compute governor).
ikigai-throttle = { workspace = true }
# mDNS announce/browse. The one sibling this host names by path rather than through
# `[workspace.dependencies]`; the version is the LOCKSTEP version, not a floor (see the root
# manifest for why, and `crates/ikigai-cli/tests/lockstep_pins.rs` for the check).
ikigai-discovery = { path = "../ikigai-discovery", version = "0.2.5" }
# The plan resources — `urn:plan:eval`, `urn:plan:validate`, `urn:plan:requires` — live beside
# the runner they share with the REPL's `run` (ledger #956). `plan-reader` is the feature that
# can read a plan graph back; this native host has no wasm constraint keeping it off, and the
# workspace entry turns it on. A registry crate since 0.1.70, from
# github.com/ikigai-rs/ikigai-engine.
ikigai-engine = { workspace = true }
ikigai-fs = { workspace = true }
ikigai-http = { workspace = true }
ikigai-runbook = { workspace = true }
ikigai-rdf = { workspace = true }
ikigai-sparql = { workspace = true }
# Repository browsing + the persistent explanation/annotation archive, opt-in via
# `browse.root` config lines (see src/browse.rs for the config grammar).
ikigai-browse = { workspace = true }
# The persistence switch for the browse/sparql shared store: ikigai-browse and
# ikigai-sparql both keep oxigraph at default-features = false (wasm-clean, no
# storage engine), and THIS host enables rocksdb — feature unification turns
# `Store::open` on for the one shared Store type (re-exported as
# ikigai_sparql::Store, which is what src/browse.rs names). Not imported directly.
oxigraph = { version = "0.5", default-features = false, features = ["rocksdb"] }
ikigai-sniff = { workspace = true }
ikigai-sexpr = { workspace = true }
# `urn:diagram:*` — the local root's arrangement as an SVG. Local root only; see `root_members`.
ikigai-diagram = { workspace = true }
ikigai-sign = { workspace = true }
# Public-key encryption (urn:encrypt:encrypt/decrypt, age/X25519) — dual of sign, embedded-only.
ikigai-encrypt = { workspace = true }
# Timezone conversion (urn:tz:convert) + zoned clock (urn:tz:now) — pure, bound in base_space.
ikigai-tz = { workspace = true }
ikigai-intray = { workspace = true }
ikigai-email = { workspace = true }
ikigai-intake = { workspace = true }
ikigai-passkey = { workspace = true }
# serde derive for the small passkey-credentials.json store.
serde = { workspace = true }
ikigai-secret = { workspace = true }
ikigai-xslt = { workspace = true }
ikigai-jsonld = { workspace = true }
# jq and CSV as resources (urn:json:*): the local root only, not the served kernels.
ikigai-json = { workspace = true }
ikigai-shacl = { workspace = true }
# The layer host `serve quic://` links when the config home has a `layers/` directory
# (`layers.rs`, ledger #1188). Bound beside `ikigai-shacl` above: admission composes
# `urn:shacl:validate`, and a layer whose validator is missing admits nothing.
ikigai-layers = { workspace = true }
# The spam filter (`urn:bayes:*`, `src/bayes.rs`, ledger #1512), bound in the local root only when
# the binary arms it with a state directory and named models. Unconditional rather than behind a
# feature: it adds no third-party crate to the graph (core, serde, serde_json are here already),
# so a feature would buy no build time and would add a configuration CI has to cover (field
# guide 9c). The SWITCH is the state directory plus the models, as `layers/` is for the layer host.
ikigai-bayes = { workspace = true }
# LLM inference (urn:llm:ask + urn:llm:<provider>:ask), on the native ureq transport.
ikigai-llm = { workspace = true }
# Video-conference scheduling (urn:meeting:schedule + urn:meeting:zoom:schedule), on the same
# native transport; reads the Zoom creds from the keystore via a SecretReader (below).
ikigai-meeting = { workspace = true }
# Parse the LLM annotation graph (IKIGAI_LLM_ANNOTATIONS, Turtle) into the
# (subject, predicate, object) facts Registry::apply_annotations consumes. The
# same pure-Rust Oxigraph crates ikigai-rdf already pulls into this tree.
oxrdf = "0.3"
oxrdfio = "0.2"
# The durable dataset behind `urn:iki:store:*`, opened from a path this host holds for
# the life of the process. Optional: see `[features]` above and `src/store.rs`.
ikigai-store = { workspace = true, optional = true }
# The work ledger riding on that dataset (`urn:iki:ledger:*`). Bound in the same
# `Fallback` as the store and behind the same feature — see `src/store.rs`.
ikigai-ledger = { workspace = true, optional = true }
ikigai-scheduler = { workspace = true }
# The time transport (urn:time:schedule/cancel/jobs): fires a kernel resource-request
# on a timer. Bound in root_space; its kernel handle is installed in watched_kernel.
ikigai-time = { workspace = true }
# Needed to coerce the built kernel to `dyn Resolver` when installing it on the time
# registry (ikigai-core doesn't re-export the Resolver trait).
ikigai-resolve = { workspace = true }
serde_json = { workspace = true }
# OS randomness for minting a client link token.
getrandom = "0.2"
# SHA-256 of a layer front's bearer token: `layer-tokens.json` stores hashes, never tokens
# (`tokens.rs`). Already in the graph at 0.10 (ikigai-quic's fingerprints, and this crate's tests).
sha2 = "0.10"
# Ed25519 over standard PKCS8/SPKI keys — the decide-link token. Same crate and key formats
# ikigai-sign uses, so a `urn:secret:generate type=ed25519` key loads in both.
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem"] }
# URL-safe base64 for the token (it rides in a query string).
base64 = "0.22"
# Local time (OS timezone) for urn:time:now (the nav/REPL clock). `clock` feature =
# Local::now; default-features off to skip the unused parsing/serde surface.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Filesystem watching — the first external golden-thread freshness source: an
# out-of-band change to a workspace file cuts its thread so cached reads recompute.
notify = "6"
# Native HTTP client backing the ikigai-http transport (blocking, runtime-free, so
# it works under the CLI's `futures::block_on` without pulling Tokio).
ureq = { workspace = true }
async-trait = "0.1"
# The names layer (`names.rs`) rebinds on its file watch's own thread, which has no executor.
futures = { workspace = true }

[dev-dependencies]
# `tests/layer_door.rs` and `layers.rs`'s own tests mint a throwaway age identity, the key a layer
# host (ikigai-layers 0.3.0) seals its state to, as `age-keygen -o` would.
age = { workspace = true }
# What "done" means for a module, as one test — run here over the two kernels this crate
# COMPOSES (`kernel()` and `kernel_for()`), not over a module's own space. See
# `tests/conformance.rs` for what that changes: the walk fires endpoints under root, and a
# composing host binds subprocess, network, inference, mail and platform seams.
#
# 0.8.0 (the wave of 2026-10-14), up from 0.2.0: `Suite::own` scopes each walk to the ids this
# workspace owns, so the endpoints of the crates this host composes are inherited and never
# fired (that replaced a hand partition and about thirty hazard opt-outs), and REQUIRED holds
# each required input to a typed refusal. The three findings that held this pin at 0.2.0 since
# 2026-10-06 are decided in `tests/conformance.rs`: `host-arrangement` is declared pure (it
# re-renders the arrangement the kernel was built from), and `calendar-request` /
# `contact-block` waive AUTHORITY and REQUIRED with their reasons (a signed link token is the
# authority, and a bad link of any kind answers one uniform page).
# ⚠ `^0.8.0` is also a ceiling below 0.9.0.
# 0.9.0 (ledger #1547): REQUIRED probes input groups through `ActionSpec::check`, OUTPUTS honors `output_from`,
# open argument sets and empty enumerations are understood. ⚠ `^0.9.0` is also a ceiling below 0.10.0.
# 0.9.1 (ledger #1882): VALIDATE's hint allows an optional binding's default (core 0.1.106). Not an API floor.
# ⚠ `^0.9.1` is also a ceiling below 0.10.0.
# 0.10.0 (ledger #1546): the FAILURES check (declared failure classes = produced, core 0.1.108's
# `ActionSpec::fails` over `Error::class()`), opt-in through `Suite::check_failures()` in 0.10 and the
# default from 0.11.0; `Suite::fails_under` probes. ⚠ `^0.10.0` is also a ceiling below 0.11.0.
# 0.11.0 (ledger #2356): the release on ikigai-core 0.2.0; DATATYPES and FAILURES run by default.
# ⚠ `^0.11.0` is also a ceiling below 0.12.0.
ikigai-conformance = "0.11.0"
# The conformance fixture SEEDS the two edge verifying keys and one signing key, so the
# decision faces are walked over real state instead of reporting "did not resolve". Same
# version and features as the library dependency above: the fixture must write exactly the
# encodings `verifying_key_at` / `parse_signing_key` read (SPKI PEM and PKCS8 PEM).
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pkcs8", "pem"] }
# The passkey endpoint tests play the authenticator: a fixed P-256 key signs assertions.
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
sha2 = "0.10"
