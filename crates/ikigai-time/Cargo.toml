[package]
name = "ikigai-time"
description = "The time transport: originates kernel resource-requests on a timer (one-shot or recurring)."
# Independent of the workspace lockstep: a leaf transport, bumped on its own for the
# id=all cancel feature (0.1.8 → 0.1.9) without rev'ing every sibling crate.
# 0.1.12: publishes source that has moved TWICE since 0.1.11 shipped (#134 structured
# Error, #265 urn:host:health). Not cosmetic — 0.1.11 on crates.io no longer COMPILES
# for a fresh consumer: it predates the structured-Error migration, so once cargo
# resolves a current ikigai-core, `one_line(&e)` is a type error. Found installing
# cms-server, which pins this crate.
# 0.2.0 — a MAJOR bump under 0.x, not the 0.1.13 the fix alone would need. `JobRegistry::new`
# now takes the host's `Arc<dyn Clock>`, because 0.1.12 stamped `last_run` with
# `std::time::Instant::now()`, which is unimplemented on wasm32-unknown-unknown: it compiled
# and panicked on the first completed job, under the registry lock, killing every later
# `urn:time:*` read in the browser demo. The argument is required so a host that forgets a
# clock is a compile error, not a runtime panic — and that makes the signature source-breaking.
# Shipping it as 0.1.13 would land inside `^0.1.11`, and ikigai-cms-web's server calls
# `JobRegistry::new(Arc::new(ThreadTimer))` at exactly that pin: a caret bump must never break
# a build, so the break gets a version that says so. Consumers add one argument
# (`Arc::new(SystemClock)` natively, the `Date.now()`-backed clock in a browser).
version = "0.2.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
ikigai-resolve = { workspace = true }
