[package]
name = "ikigai-quic"
description = "QUIC transport with mutually-pinned TLS to a remote kernel."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
ikigai-resolve = { workspace = true }
ikigai-wire = { workspace = true }
# The `ring` crypto provider everywhere — no cmake/nasm toolchain needed, so it
# builds portably in CI (unlike the default `aws-lc-rs`).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] } # tls12: the HTTPS face (`https_server_tls`) also speaks TLS 1.2; QUIC stays 1.3-only
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"
# A pinned client certificate's validity window (notBefore, notAfter), honored at the
# handshake (ledger #1826): rustls hands a custom verifier the DER and the time, never the
# window. Already in the workspace lock through libp2p-tls; no default features, so no crypto.
x509-parser = { version = "0.18", default-features = false }
# The STABLE certificate fingerprint (SHA-256 of the leaf DER) that an operator
# keys per-identity authority on — `DefaultHasher` cannot promise stability across
# toolchains, and a config key must outlive a Rust upgrade.
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync"] }
# Drives a streamed answer's body (a futures `Stream`, runtime-free in core) and resolves a
# streamed issue off the runtime's workers (wire v10, ledger #2242). Already in the graph
# through ikigai-resolve.
futures = { workspace = true }
# For a dual-stack server socket (IPV6_V6ONLY off) — std can't set it. Already in
# the tree via quinn; declared directly so `serve` can build the socket itself.
socket2 = "0.6"
# The server's STATELESS-RESET key as an HMAC key (ledger #1092): derived from the server's
# own identity, so a restarted server resets the connections its predecessor held and a
# client heals at once instead of waiting out the idle timeout. Already in the tree through
# quinn's and rustls's `ring` features; declared directly to construct `hmac::Key`.
ring = "0.17"
# quinn does not re-export `HashedConnectionIdGenerator`: the server's connection IDs must be
# keyed on its identity too, or a restarted server REJECTS the old IDs as not its own and
# drops their packets without resetting (ledger #1092). `from_key` is the API used; the floor
# is the version this lock has always built (quinn 0.11.11 requires it), not a guess older.
quinn-proto = { version = "0.11.17", default-features = false }

[dev-dependencies]
# A test endpoint that answers with a streamed body (`Endpoint::invoke_body`).
async-trait = "0.1"
