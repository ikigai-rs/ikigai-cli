[package]
name = "ikigai-engine"
description = "Renderer-agnostic REPL engine for ikigai: parses a request line, drives a Backend, and reports the result as an Action. Shared by the CLI and the browser frontend."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ikigai-core = { workspace = true }
ikigai-resolve = { workspace = true }
# The process vocabulary (`ik:Process`/`ik:Step`/`ik:Argument`/`ik:Fork`) and the one
# place the plan IRI scheme is coded — `plan.rs` builds every skolem IRI through it
# rather than re-spelling `urn:plan:{id}:step:{n}` and drifting from the published terms.
ikigai-vocab = { workspace = true }
serde_json = { workspace = true }
# Reading a stored plan back — see `[features].plan-reader` below for why it is optional.
# oxttl is the Turtle parser the rest of the ecosystem's RDF already sits on; oxrdf comes
# with it, because oxttl yields `oxrdf::Triple` and re-exports none of those types, and
# oxttl pins `oxrdf = "=0.3.4"`, so the pin here is that exact version.
oxttl = { workspace = true, optional = true }
oxrdf = { workspace = true, optional = true }
# block_on + join_all for the parallel fork/map path. Only block_on/join_all are
# used (no ThreadPool), so the engine still compiles to wasm; without an injected
# spawner the parallel path is never taken (sequential fallback).
futures = { workspace = true }

[features]
# ★ OFF by default, and that is the point: this crate is documented as compiling to
# wasm32-unknown-unknown (ikigai-web-demo runs the kernel in a browser), and reading a
# plan back pulls oxrdf → `rand` → `getrandom`, which **fails to compile** on
# wasm32-unknown-unknown without a rustflag only the final consumer can set. Rendering a
# plan (`plan <spec>`) costs nothing and is always available; executing a stored one
# (`run <spec>`) needs the parser, so it is a feature the host asks for — `ikigai-cli`
# does. A wasm build keeps the default and gets a `run` that says which feature is off,
# rather than a build that does not link.
#
# Measured 2026-09-13, not assumed: `cargo check -p ikigai-engine --target
# wasm32-unknown-unknown` passes on main and failed with these deps unconditional. The
# `wasm32 lib clippy` job in ci.yml now runs exactly that, so the claim is a gate.
default = []
plan-reader = ["dep:oxttl", "dep:oxrdf"]

[dev-dependencies]
# End-to-end `sink`/`source`/`cap` tests mount the real file module.
ikigai-fs = { workspace = true }
# The plan round-trip validates every rendered `ik:Process` graph against the published
# shapes (`ikigai_vocab::SHAPES`). A renderer that emits a shape-invalid plan must fail the
# build here, not the reader out there — and `ikigai-vocab` parses its shapes for SYNTAX
# only, so the real validator has to come from somewhere.
ikigai-shacl = { workspace = true }
serde_json = { workspace = true }
