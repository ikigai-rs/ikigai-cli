[package]
name = "ikigai-web"
description = "Inbound HTTP transport: serve an ikigai kernel over HTTP. Maps HTTP method↔verb, Accept↔conneg, path↔iri, and a capability-per-request (the multi-tenant door). A thin adapter — app logic stays in resources/compositions/caps."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# The kernel it serves.
ikigai-core = { workspace = true }
# `ikigai_fn::html::html_text`: the error page escapes its status and message with the
# ecosystem's one escaper (ledger #1868).
ikigai-fn = { workspace = true }
# The accept loop, the per-connection task and the deadlines. The HTTP/1.1 framing on each
# connection is hyper's (ledger #2236); `read_request`/`write_response` stay hand-written for a
# door with a router of its own (the layers front).
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time", "sync"] }
# The door's HTTP/1.1 connection: framing, keep-alive, chunked request bodies, `Expect:
# 100-continue`, the header read deadline. Floors are the versions this crate was moved onto
# and tested with: `auto_date_header` and `ReasonPhrase::from_static` are recent, and all of it
# was already in the workspace graph through reqwest. HTTP/1 only: HTTP/2 is a decision of its
# own (the connection cap, the 408s and the deadlines mean different things there).
hyper = { version = "1.11", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }
# The version-independent seam (`door.rs`) speaks `http`'s request/response and `http-body`'s
# `Body`, so another listener (HTTP/2, a QUIC HTTP/3 listener) feeds the same door logic.
http = "1"
http-body = "1"
# `Limited` is the body bound: a body past `max_body_bytes` is an error, never a truncation.
http-body-util = "0.1"
bytes = "1"
# Strong ETag = a content hash of the representation (type + bytes). Same hash family
# core uses for content addressing; keeps the validator stable and collision-resistant.
blake3 = "1"
# The first PATCH strategy: RFC 7386 JSON Merge Patch over serde_json values. Taken from
# the workspace so this crate gets `preserve_order` too — the `?description` projection's
# `properties` must serialize in the endpoint author's declaration order, and a private
# `serde_json = "1"` here would only inherit that by accident of feature unification with
# the rest of the workspace (and not at all under `cargo test -p ikigai-web`).
serde_json = { workspace = true }
# The clock behind a write's `received` provenance, formatted RFC 3339. `clock` only —
# no zone database needed here (the edge always stamps UTC).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# The accept loop classifies its errors by errno (EMFILE, ENFILE, ECONNABORTED, …), which
# `io::ErrorKind` does not name: `EMFILE` has no kind of its own (ledger #720).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
futures = { workspace = true }
