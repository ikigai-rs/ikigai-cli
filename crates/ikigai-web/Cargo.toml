[package]
name = "ikigai-web"
description = "Inbound HTTP transport: serve an ikigai kernel over HTTP. Maps HTTP method↔verb, Accept↔conneg, path↔iri, and a capability-per-request (the multi-tenant door). A thin adapter — app logic stays in resources/compositions/caps."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
# The kernel it serves.
ikigai-core = { workspace = true }
# Minimal async I/O for the accept loop + per-connection handler (hand-rolled HTTP/1.1,
# mirroring ikigai-cms-web's serve_http — Apache fronts it, so parsing stays small).
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "time"] }
# Strong ETag = a content hash of the representation (type + bytes). Same hash family
# core uses for content addressing; keeps the validator stable and collision-resistant.
blake3 = "1"
# The first PATCH strategy: RFC 7386 JSON Merge Patch over serde_json values. Taken from
# the workspace so this crate gets `preserve_order` too — the `?description` projection's
# `properties` must serialize in the endpoint author's declaration order, and a private
# `serde_json = "1"` here would only inherit that by accident of feature unification with
# the rest of the workspace (and not at all under `cargo test -p ikigai-web`).
serde_json = { workspace = true }
# The clock behind a write's `received` provenance, formatted RFC 3339. `clock` only —
# no zone database needed here (the edge always stamps UTC).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
futures = { workspace = true }
