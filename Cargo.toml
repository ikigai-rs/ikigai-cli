[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# 0.1.32 is WEB PUSH (ledger #618): `EdgeConfig.push` (off by default) serves a server-sent-events
# stream at `/_ikigai/push` — one core cut listener (core 0.1.82's `Kernel::listen`) per stream, under
# exactly that session's capability plus `urn:cap:kernel:listen` (403 without it); `cut` events name
# the thread and the subscribed paths to refresh, `resync` on a dropped queue or a reconnect, a
# heartbeat, and the edge's connection cap and write deadline. `ikigai serve --http <port> --push`.
# The workspace's core pin rises to 0.1.82. Adding `EdgeConfig.push` is a new public field; every
# known consumer builds `EdgeConfig` with `..EdgeConfig::default()`.
#
# 0.1.31 is the web edge's HONEST CACHING (ledger #604, and #570's cli half): `Expiry::Never`
# was projected as `Cache-Control: public, max-age=31536000, immutable`, so a browser kept a
# thread-dependent answer (gonk's ledger listing) for a year and never revalidated. Now `Never`
# is `no-cache` with the strong ETag (a cheap 304 while unchanged), `At(t)` keeps `max-age` only
# when the answer is self-contained, `private` replaces `public` when a credential changed the
# capability, and one `Vary` names `Accept`, `Authorization, Cookie` and `Origin`. `immutable` is
# never emitted: since core 0.1.73 no cacheable answer is thread-free. Only `ikigai-web` changed.
#
# 0.1.30 carries WIRE V8 and the web edge's hardening, on core 0.1.80. Wire v8 appends
# `WireError::Conflict` (variant 8) and is BACKWARD COMPATIBLE: a v8 peer accepts a v7 hello and
# answers it with 7, redials a v7 server at 7, and downgrades Conflict to `Endpoint("conflict: …")`
# for a v7 peer, byte-identical to what v7 always sent (ledger #583). QUIC and p2p offer both
# versions. The HTTP edge answers Conflict with 409, decodes the target as BYTES (a malformed
# escape is a 400, never a panic; `+` is a space in the query only; `%2F` stays inside its
# segment) and bounds each connection in time and number (ledger #80, #591). Source-breaking
# only for an out-of-tree exhaustive `match` on `WireError` (ledger #598).
#
# 0.1.29 adopts core 0.1.78 (the pin below says which call needs which release): time reads the
# invocation, so a temporal corridor pins it (`urn:tz:now`, `urn:time:now`; the engine's `as-of=`,
# ledger #532), and the served surface carves `urn:personal:` out with a `Limit` rather than by
# choosing a different space (ledger #536). Additive — no public item changed shape.
#
# 0.1.28 is a RELEASE-ORDER fix with no behaviour change: `ikigai-resolve` built `Resolved`
# as a struct LITERAL at three sites, and core 0.1.78 (merged, not yet published) gives
# `Resolved` a fourth public field, `answered_by` — the `canonical` flag day of 0.1.64 again.
# The tree is shielded by `Cargo.lock` (core 0.1.70), but the PUBLISHED 0.1.27 pins `^0.1.64`,
# which ADMITS 0.1.78, so every lockless consumer stops compiling the moment core publishes.
# The sites now take `Resolved::new(endpoint, bindings)`, which exists since 0.1.64, so this
# compiles against the lock AND against 0.1.78 — and it must publish BEFORE core 0.1.78 does.
# The core pin and the lock are deliberately untouched (ledger #544; the pin bump is a later,
# separate PR after core publishes).
#
# 0.1.27 is additive: `ikigai-web` grows `PrincipalFn` / `EdgeConfig::principal_fn`, the identity
# twin of `CapFn` — a door that authenticated a request hands the transport WHO asked, and a
# mutating verb carries it as the `principal` argument beside `received`/`client` (the cli half
# of ledger #76; reserved from the query string like the other two). Every `EdgeConfig` consumer
# builds it with `..EdgeConfig::default()`, so the new field is not a flag day. `None` = 0.1.26.
#
# ⚠ 0.1.26 carries a SECURITY fix, and the published 0.1.25 still has the defect (ledger #79):
# every `urn:time:*` job fired under ROOT, set once when the registry was built, so an attenuated
# caller — an MCP agent above all — could schedule a Sink or Delete against any IRI and it ran with
# full authority. `ikigai-time` 0.4.0 records the capability that scheduled each job and fires every
# tick under `ceiling.clamp(recorded)`; `urn:time:schedule|cancel|jobs` now declare
# `urn:cap:time:schedule|cancel|read`. `ikigai-embedded` names each host job's authority
# (`host_job_authority`). The rest of the workspace moves only because the release is the whole
# workspace (below). ⚠ An MCP grant without the time tokens no longer offers `urn:time:*` at all.
#
# ⚠ 0.1.25 carries a SECURITY-SHAPED wire fix and the published 0.1.24 still has
# the defect (ledger #479, #487). `ikigai-ipc` matched replies to calls
# POSITIONALLY on one stream with no correlation id, and a call that missed its
# read deadline returned `Error::Timeout` while KEEPING the connection — so the
# server's abandoned reply was handed to the next call, well-formed and wrong,
# permanently:
#
#     read a -> Ok("a")   read b -> Err(Timeout)
#     read c -> Ok("b")   read a -> Ok("c")
#
# ★ It is a CAPABILITY defect, not merely a correctness one: a reply computed for
# one request reaches a different request on the same connection, so a host
# multiplexing identities over one standing `IpcResolver` hands one principal's
# answer to another with NO grant consulted — the check already passed, for the
# other request. A Retry overlay makes it worse by consuming the abandoned reply
# and looking like a clean success. `ikigai-quic` was never affected:
# `Wire::attempt` opens a fresh bi stream per call.
#
# ⚠ This version is the whole point of the bump. Until it publishes, every
# consumer of `ikigai-ipc` on crates.io has the defect, and the condition that
# reaches it is routine here — the 30s self-description bound, which plasma's
# own config.toml documents gonk degrading at.
#
# ★ A RELEASE OF THIS WORKSPACE IS THE WHOLE WORKSPACE, published in dependency
# order (`just -f ~/git-personal/ikigai-devtools/justfile registry-drift ikigai-cli`
# prints the order and the verdict). Twice it was not — 0.1.24 shipped only the
# transport chain, 0.1.25 at first only resolve → wire → ipc — and nothing noticed
# for weeks because nothing looked: twelve crates sat two minors behind the tree
# they ship from (ledger #494; Brian: "nothing was intended"). The 0.1.25 catch-up
# wave closed the gap and the daily scan now goes red on any publishable member
# whose tree version is ahead of crates.io. ⚠ So this comment names NO crate as
# behind or ahead — that was a snapshot of the registry, true for one afternoon
# and wrong the next, in the most authoritative place in the tree. Ask the gate.
