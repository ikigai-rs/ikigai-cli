# 0.1.56 was A DEAD PEER IS FOUND IN SECONDS (QUIC KEEP-ALIVE), AND THE CONSUMER PINS.
# Stacked on 0.1.55, which was already on crates.io (published from main at PR #471, so it carries
# every entry below); nothing unpublished sat beneath it. In PR #472 (ledger #1359):
# - A QUIC CLIENT PINGS. Its connection's idle timeout is `ikigai_quic::LIVENESS_TIMEOUT` (15 s,
#   capped by `quic.timeout` when shorter) with a PING every `KEEP_ALIVE_INTERVAL` (5 s) of quiet
#   (both new, additive), so a peer that vanishes mid-call without closing is found by both ends
#   in seconds, not at the five-minute `quic.timeout`. A live peer answers the pings, so a long
#   silent call keeps its whole deadline: `quic.timeout` is still the default call deadline. The
#   SERVER does not ping, so a client older than 0.1.55 (no call deadline) keeps its idle bound.
# - A QUIC door runs each resolution off its runtime worker (`block_in_place`): blocking the
#   worker froze the connection's driver, so no acknowledgment left while a call ran. ⚠ Behavior:
#   upgrade doors BEFORE their clients. A 0.1.56 client against an older door can lose a call
#   silent for longer than 15 s (a model peer, an explain), because that door stops answering
#   pings while it works.
# - Pins: `ikigai-core`/`ikigai-vocab` "0.1.98" (past the yanked 0.1.97; the lock holds 0.1.99),
#   `ikigai-store` "0.2.19" (root and intray; ledger #1333, #1354), `ikigai-ledger` "0.11.0"
#   (`^0.8.0` was a ceiling three minors below; compiles unchanged).
