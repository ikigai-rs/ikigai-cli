# ONE process, rather than rebuilt from its sources on every boot. Optional, behind this
# workspace's `store` feature (ikigai-embedded), because a host that wants no dataset
# should carry none — and because the ledger that rides on it is opt-in too.
#
# `features = ["persistent"]` is the whole point of taking this dependency: the crate is
# in-memory by DEFAULT and the durable backend lives behind a `cfg(feature)` inside a
# LIBRARY, which is not a target, so nothing — not `--all-targets`, not `ci-drift`'s
# required-features check — would report its absence. Without it `DurableStore::open` does
# not exist and this host would compile against a store that forgets.
#
# ⚠ And the RocksDB it enables is ALREADY in this workspace's graph unconditionally:
# `ikigai-embedded` turns on `oxigraph/rocksdb` for the browse/sparql shared store, so
# `oxrocksdb-sys` compiles on every default build here whatever this line says. Cargo
# feature unification is global, so the two cannot disagree. (Measured 2026-09-13:
# `oxrocksdb-sys` is in this repo's Cargo.lock on main, before this dependency existed.)
#
# 0.2.0 is the floor AND the first version that exists to depend on: 0.1.70 was the
# in-memory placeholder a lockstep sweep published by accident and Brian yanked.
# ⚠ `"0.2.0"` is a RANGE, `>=0.2.0, <0.3.0` — when the store reaches 0.3 this line must
# move or this host silently freezes out of every release after it.
# ⚠ 0.2.2, not 0.2.0: that is where the store's NARROW per-graph doors arrive
# (`urn:iki:store:graph-select` / `graph-update`, gated by
# `urn:cap:store:{read,write}:graph:<G>`), and every read and write `ikigai-ledger` makes
# goes through them. Nothing in this host calls them directly — the floor states the API
# the COMPOSITION uses, which is the same rule read one level out.
# ⚠ …and 0.2.3, not 0.2.2, because 0.2.2 DOES NOT COMPILE here — the strongest form a
# floor can take. `term_to_json` matched `oxrdf::Term` exhaustively without the RDF-star
# arm, true of the store's own graph and false under Cargo's global feature unification:
# this workspace pulls rudof through `ikigai-shacl`, which enables `oxigraph/rdf-12` →
# `oxrdf/rdf-12`, so `Term::Triple` exists and the match is non-exhaustive. The store's own
# CI passes `features: "persistent"` and never sees it. A floor of 0.2.2 would be a floor
# on a version no consumer of this workspace can build.
# ⚠ …and 0.2.6 (the audit release, ledger #751), a SECURITY floor: through 0.2.5 an update
# with a WHERE ran under the write grant alone, so a write-only caller could read a graph through
# an escaping `INSERT … WHERE` and through the refusal text. 0.2.6 needs the READ grant on every
# graph a WHERE reads — which is why `store::grants_for(…, Purge)` now carries the graveyard's
# read token (ledger #760): `ikigai-ledger`'s purge reads the graveyard. The one other behavior
# a host can see is "two live spaces over one store forfeit coverage"; this host binds ONE space
# per process (`STORE_SPACE`), so nothing here meets it. API: additive only.
# ⚠ …and 0.2.7 (ledger #915), a SECURITY floor, and the one this line states now: through 0.2.6
# oxigraph's recursive SPARQL parser ran inline on the caller's thread, so a ~3 KB query of
# nested parentheses at any of the ten doors that parse caller text (the eight query IRIs and
# both updates) overflowed the stack, and a stack overflow ABORTS the process — gonk, the
# ledger and every other tenant with it. 0.2.7 refuses text over 1 MiB or nested past 64
# levels as a typed InvalidArgument before the parser sees it, and parses and evaluates on a
# thread of 16 MiB + 512 B per byte of text. The safety of this host now depends on that
# release, so the floor states it. API: additive only.
# ⚠ …and 0.2.10 (ledger #1083), a SECURITY floor, and the one this line states now: every one of
# the ten doors refuses `SERVICE` and `LOAD` as a typed `InvalidArgument` before evaluation, and
# every evaluator carries a refusing service handler. In THIS build oxigraph's `http-client` is on
# (rudof, by feature unification), and under 0.2.7 a `SERVICE` at any query door, an update whose
# `WHERE` federates, and `LOAD <http://…>` at `urn:iki:store:update` all REACHED a loopback stub
# (`crates/ikigai-embedded/tests/egress.rs`, measured before and after). 0.2.10 also exports
# `ikigai_store::service` (the refusing evaluator and the door checks) for consumers that build
# their own. Behavior across 0.2.8–0.2.10 a caller sees: a time budget (5 s base, 120 s ceiling,
# raised by a `urn:cap:store:budget:<ms>` grant), algebra bounds and a `budget=` input; answers
# over 100k rows or 16 MiB refused (raised by `urn:cap:store:answer:*`); a write-without-read
# caller's DROP/CLEAR/CREATE runs SILENT. The ledger's grant list (`store::grants_for`) needs none
# of the new grants: its reads stay inside the defaults.
# ⚠ …and 0.2.11 (ledger #1108), an API floor taken with `ikigai-intray`'s: the consumer-worded
# refusals (`service::refuse_service_with`), so a `match=` refusal names the intray's remedy.
# Additive for this host otherwise.
# ⚠ …and 0.2.12 (ledger #1127), a PERFORMANCE floor: every update runs on the store's one writer
# thread. Each used to commit on a fresh thread, and RocksDB seeds its memtable skiplist from the
# thread id, so reads after a bulk write ran 2x to 14x slower in release until the memtable flushed.
# ⚠ …and 0.2.14 (ledger #1198). 0.2.13 (ledger #1132) is a PERFORMANCE floor: a graph-scoped update
# copies only its footprint into the scratch store, not the whole graph, so a ledger append no longer
# costs O(ledger). 0.2.14 (ledger #1207) adds `DurableStore::shared_writer()`, the writer thread for
# raw-handle hosts; this host does not call it yet. Both are additive here.
# ⚠ …and 0.2.18 (ledger #1327), a SECURITY floor taken with `ikigai-intray`'s: the store's own doors
# were already time-bounded (since 0.2.7), and 0.2.18 hands the same deadline, token and overdue cap to
# a consumer as `EvaluationBudget`, which intray's `match=` now runs under. Additive for this host.
# ⚠ …and 0.2.19 (ledger #1333, #1354), a SECURITY floor taken with `ikigai-intray`'s: an update's triple
# terms are bounded in what it leaves in the store (#1333), and a `<<( )>>` template nests to
# MAX_RDF_NESTING rather than being refused as too branchy (#1354). No signature changed.
# ⚠ …and 0.2.21 (ledger #1426, #1427, #1428, #1429), a SECURITY floor taken with `ikigai-intray`'s, not
# an API floor: a GRAPH block and three planner-erasable wrappers hid join operands from
# MAX_JOIN_OPERANDS, so an in-bounds query planned uncancellably for minutes (#1426, #1429); the overdue
# cap reserves its slot at start (#1427); `urn:iki:store:load` bounds document size and XML entity
