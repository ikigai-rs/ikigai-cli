#   resource under one capability through a principal-naming door no longer share a cached answer.
# - ikigai-web: an ADMISSION hook ahead of every answer (ledger #879, item 1). `EdgeConfig.admit_fn`
#   (`AdmitFn`, `Refusal`) sees each request before the push stream, `OPTIONS`, the `?description`
#   face and dispatch, and may refuse it (400/403/404/421/429; any other status is a 403). Those
#   three answers never reach the kernel, so a refusal computed as an empty capability and answered
