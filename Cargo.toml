# 0.1.66: THE FAILURE CLASSES (CORE 0.1.108), WIRE V9, AND THE EDGE'S DECIDED STATUSES (ledger #1546).
# Stacks on 0.1.65, which is already on crates.io. Nothing unpublished sits beneath it. It carries
# PRs #554-#557.
# ⚠ Published as a patch in the lockstep 0.1 line, but a caller matching on `ikigai_wire::WireError`
# or `ikigai_wire::Call` exhaustively stops compiling: `WireError` gains five variants and `Call` one
# (PR #556). Nothing in ~/git-personal does either.
# Operators, read these first:
# - Timeout is 504, not 503 (PR #557): the HTTP door's one status change an operator may notice. A
#   monitor keyed on 503 for "the edge waited on something that did not answer" reads 504 now;
#   `Unavailable` stays 503. The rest of the table is new, not moved: `RetryAfter` 429 with
#   `Retry-After` (seconds, rounded up, never 0), `OverBudget` 422, `Refused` 502, `Unsupported`
#   405 with `Allow` when it names a verb and 501 when it names a host facility; `DepthExceeded`
#   and `Endpoint` stay 500. The JSON error body carries `class` on every error.
# - A backend's 500 is no longer retried (ikigai-http 0.3.0 and ikigai-llm 0.16.0, PR #555): an
#   origin's 500 is `Endpoint` (class unknown), where it was the transient `Unavailable`, so a Retry
#   or Failover above `urn:http:*` or `urn:llm:*` returns it instead of repeating it. An origin's
#   401/403 is `Refused` (was `Denied`; `Denied` stays the capability floor's word), its 429, and a
#   503 carrying `Retry-After`, is `RetryAfter` with the delay. The host's catalog inherits
#   `http-propfind` and `http-report` (WebDAV).
# - Wire v9 (PR #556), backward compatible like v8: `MIN_PROTOCOL_VERSION` stays 7, a v9 peer
#   serves v7 and v8 at their own version. The five failure-class errors cross typed to a v9 peer
#   and as the same `Endpoint(display)` a v8 server sends to an older one. `Call::IssueWith`
#   carries a run's retry pool and deadline from a mount to its peer; THE DEADLINE TRAVELS AS TIME
#   LEFT in whole milliseconds, never an instant, since peer clocks differ, and the server adds it
#   to its own now. A peer that sends no context gets today's behavior. ikigai-python and
#   ikigai-deno decode tags 9-13 already; `IssueWith` on their server side is next (the field
#   order and byte vectors are in PR #556).
# - ikigai-throttle 0.2.0 (PR #555): the overlays decide from `Error::class()`. This host wires
#   only `Timeout`, which is unchanged.
# - ikigai-meeting 0.4.0 is on ikigai-http 0.3.0, so the TRANSITIONAL second copy of ikigai-http
#   (`ikigai-http-02`) that `ikigai-embedded` carried for its `HttpTransport` is deleted (PR #559,
#   after 0.1.66; it rides the next bump).
# - MCP (PR #557): a kernel error's tool result names `kind` and `class` (and a RetryAfter's delay)
#   on a line after the display; the 2024-11-05 result has no structured slot.
# - Triage (PR #554, ledger #1905): the CORS no-Origin early return and the `/proc/meminfo` parse
#   are not defects; both are pinned by tests, and the parse's one unchecked multiply is checked.
# - `.gitattributes` (PR #555, ledger #1886): the MCP copy of core's validation vectors is LF on
#   every checkout.
# 0.1.65: THE ARGSPEC SHAPE (CORE 0.1.105-0.1.107), ONE MCP CHECKER, AND THE EDGE'S DECISION PAGES.
# Stacks on 0.1.64, which is already on crates.io. Nothing unpublished sits beneath it. It carries
# PRs #543-#552.
# ⚠ Published as a patch in the lockstep 0.1 line, but two changes break a narrow use of the library
# API: `ikigai_intake::html_escape` is removed (PR #546; `ikigai_fn::html` replaces it, and its one
# consumer was ikigai-embedded), and `ikigai_web::EndpointHeader` gains `Location`, so
# `EndpointHeader::ALL` is `[_; 6]` and `DEFAULTS` is `[_; 5]` (PR #552): code that names either
# array's length stops compiling. The enum was already `#[non_exhaustive]`. Nothing in
# ~/git-personal calls the one or names the other.
# Operators, read these first:
# - Core 0.1.105-0.1.107 (PRs #547, #548, #549, ledger #1547): the ArgSpec shape. Input groups with
#   a pipe member, list arguments whose repeats join, open and envelope argument sets, one checker
#   (`ActionSpec::check`), and declared defaults the kernel fills in. 0.1.107 (ledger #1884): the
#   cache-status probe no longer asks a mount's peer for its contract on every resolver read, so a
#   hot mounted read through the engine costs one peer `Meta` per name per TTL again, not one per
#   read. Conformance 0.9.1 (dev-dependency).
# - Pipe routing follows the shape (PR #547): a group's pipe member takes a piped or positional
#   value while no member of its group is named; a LIST argument's repeats join with its separator
#   (`graph=A graph=B` is one `graph`), and any other repeat is still refused; on an OPEN argument
#   set every `key=value` word is a named argument.
# - MCP checks every call through core's one checker (PR #548), rendered as `urn:kernel:validate`
#   renders it; the hand copy is gone. The MCP schema: a list is an array of its items, a default is
#   typed as declared, an empty enumeration is `"enum": []`, `needs` is `dependentRequired`, a closed
#   argument set is `additionalProperties: false`, an open one a described string, and an envelope's
#   carrier is no property (the fields are serialized into it on a call). Input GROUPS and a value's
#   `needs` go in the tool's DESCRIPTION, not the schema, because Claude's API refuses
#   `oneOf`/`anyOf`/`allOf` at the root of `input_schema` and fails the whole request over one such
#   tool.
# - ikigai-web (PR #548): a list argument's repeats in a query string are joined, any other repeat
#   is still the typed 400; an envelope's OpenAPI request body is its fields (JSON and urlencoded).
# - `clock-now` (PR #547): it read `html=` by presence, and the kernel now fills the declared default
#   `html=false`, so every plain read was served the HTML face. It reads the value.
# - A write precondition the door cannot check is no longer "absent" (PR #550, ledger #1883): only
#   NotFound and Unresolved mean absent. A transient failure of the current-state read answers its
#   own status (503) and writes nothing; before, an `If-None-Match: *` create-only PUT went ahead over
#   an existing resource whose store was briefly unavailable.
# - `ikigai-intake` declares its body an argument envelope, `content` its carrier (PR #551, ledger
#   #1885): MCP and OpenAPI show the form's fields, and an MCP call that gives the fields reaches the
#   intake as one JSON body. A body-only submission (a form POST, a pipe) is unchanged.
# - The edge's decision pages answer Post/Redirect/Get (PR #552, ledger #1879): a decision,
#   contact-block or label POST answers `303 See Other` to `?outcome=<word>` on its own path, so a
#   phone returning to the tab no longer asks to post again. The outcome page names no address,
#   booking or token. The same link POSTed twice records once and answers "Already recorded"; that
#   memory is per process, so a restart forgets it. ikigai-web's entity envelope accepts `Location`
#   for this, on a write's answer and to a same-origin relative reference only.
# Also:
# - PR #543 (ledger #1857): the layers front reads `Authorization` and the clipboard encodes OSC-52
#   through ikigai-http's shared helpers. Only SP and HTAB separate the auth scheme from its token.
# - PR #544 (ledger #1834): the embedded host's pages link one same-origin stylesheet,
#   `/decide/css`, and carry no inline style, so an HTML door's CSP renders them as written.
# - PR #545 (ledger #1866): the intake's redirect page carries no style; `ikigai layers post|save`
#   use the shared base64.
# - PR #546 (ledger #1868): every HTML escaper, link check and query encoder in the workspace is
#   `ikigai_fn::html` (ikigai-fn 0.5.0); `ikigai_intake::html_escape` is removed. A C0 control
#   other than tab, LF and CR renders as U+FFFD.
