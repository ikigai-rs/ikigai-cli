# - ikigai-web: `?principal=` is dropped on EVERY verb (ledger #879, item 3; R6's library half). It
#   was reserved on mutating verbs only, so a GET reached the endpoint carrying the submitter's
#   `principal`. Operator-visible: a read endpoint that took a `principal` query argument no
#   longer gets it (none is known).
# - ikigai-mcp: an OMITTED optional template binding is filled from the contract, not issued
#   literally (ledger #886). `ledger-append__sink` without `ledger` issued
