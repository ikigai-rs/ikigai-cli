[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.16"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-cli"
homepage = "https://github.com/ikigai-rs/ikigai-cli"

[workspace.dependencies]
# The released kernel, consumed from crates.io. For local cross-repo development
# against a sibling checkout, use .cargo/config.toml (see .cargo/config.toml.example).
ikigai-core = "0.1.60" # 0.1.60 = `Spawner::width()`, the read the engine's fan-out routing
# is built on: how many spawned tasks make progress AT ONCE, so a ten-branch fork on the
# default `single` scheduler is known to be one-wide. An API floor — the method is defaulted,
# so an older core compiles and silently answers `None` (= width 1) for every scheduler,
# turning width routing off wherever it would have mattered. 0.1.55's behavioural floor still
# holds beneath it: below that a MOUNTED template row whose local name-guess collides with a
# shorter sibling is dropped from the manifold, so `ikigai mcp` silently stops projecting
# browse-pr-explain and browse-pr-review.
ikigai-vocab = "0.1.33" # + event terms (ik:calendar/allDay/alert) + LLM trait terms
# The reusable function library, linked in as a published module crate.
ikigai-fn = "0.1.2" # + urn:fn:conditional (the lazy branch: if/then/else are URIs)
# Personal contexts (urn:personal:*), macOS-backed, linked as a published module.
ikigai-personal = "0.7.1" # 0.7.1 = multi-day events block every spanned day (free/busy + booking); notes/URL/attendees on the graph face + description= Sink (detail preservation)
# Capability-gated file/store module, linked as a published module crate.
ikigai-fs = "0.1.5" # 0.1.5 = path declared as Binding input (urn:file/orgfile rows in urn:kernel:actions)
# Outbound HTTP-client module (urn:httpGet…), linked as a published module crate.
ikigai-http = "0.1.7" # 0.1.7 = endpoint-owned redirects (transport must not follow; SSRF hardening)
# Interactive runbook module (urn:runbook:*) — Linked Data demo tab since 0.1.3;
# 0.1.5 adds the JSON-LD demo tab (expand/flatten/compact), which works here because
# the CLI links its own pipe-fixed ikigai-engine.
ikigai-runbook = "0.1.12" # Lisp page: + generated aliases (named verbs, cap-scoped, transcluded)
# Linked Data toolkit (separate ikigai-linkeddata repo): RDF transreption + SPARQL.
ikigai-rdf = "0.1.3" # + urn:rdf:union / urn:rdf:diff (graph set ops, with= carries ?k=v args)
ikigai-sparql = "0.1.6" # 0.1.6 = space_with_store (shared-store seam for browse/annotations)
# Content sniffing + sniff-and-dispatch (urn:sniff, urn:transrept:auto).
ikigai-sniff = "0.1.1"
# Neutral s-expr foundation: Sexpr datum + urn:sparql:from-sexpr transreptor (text/x-sexpr → SPARQL).
ikigai-sexpr = "0.1.0"
# Signing + verification: urn:sign:sign (cap-gated) / urn:sign:verify (open), Ed25519.
ikigai-sign = "0.2.0"
# Public-key encryption (urn:encrypt:encrypt/decrypt, age/X25519) — the dual of sign.
# Keys resolved through the kernel (urn:secret:<id>.enc). Embedded-only (off the wire).
ikigai-encrypt = "0.1.0"
# Secrets custody: urn:secret:{name} (cap-gated read) + urn:secret:generate/unlock
# (Ed25519 keygen + Touch ID), macOS Keychain backend. Owner-only, not served.
ikigai-secret = "0.1.5" # 0.1.5 = the urn:secret Sink write face (owns the item's ACL → silent reads)
# XSLT transform module (urn:xslt:transform) — linked natively (no download cost in a
# native binary; the dynamic/lazy form is a browser/WASI concern).
ikigai-xslt = "0.1.0"
# JSON-LD operators (urn:jsonld:expand/compact/flatten) — linked natively (the heavy
# json-ld tree is a browser-wasm concern, lazy-loaded there; native links it directly).
ikigai-jsonld = "0.1.1"
# SHACL validation (urn:shacl:validate) — rudof's validator is native-only (gated off wasm),
# so it's linked natively here; the browser serves the same resource via shacl-engine (JS).
ikigai-shacl = "0.1.0"
# The org-mode agenda (urn:org:agenda:{period}) — reads org files through the
# kernel (urn:orgfile:*) and speaks the same skolemized event graph as the
# calendar, so the two union/diff as graphs.
ikigai-org = "0.1.6" # 0.1.6 = drawer properties are read wherever the drawer sits (:ID:/:URL: below SCHEDULED:) + :ZOOM_PASSCODE:
# Unix-like text endpoints (urn:text:wc/head/tail/grep/sort/uniq/nl/rev) — the
# first satellite-built module; pure text, wasm-clean, ArgSpec showcase.
ikigai-text = "0.1.0"
# Semantic-CMS transreptors (urn:cms:*): personal content (org bookmarks/notes,
# library metadata) as one RDF graph on the dc:subject tag axis.
ikigai-cms = "0.1.1" # 0.1.1 = stitch wrapped bookmark titles (no dropped entries)
# Dev-tooling seam: git/gh/cargo as resources (urn:system:exec, urn:repo:*).
ikigai-repo = "0.1.2" # 0.1.2 = typed Error::Denied for capability denials
# Repository browsing (urn:repo:{root}:tree/file/state/hash/explain + urn:annotation:*)
# over configured roots — opt-in via `browse.root` config lines (embedded host).
ikigai-browse = "0.2.12" # 0.2.0 = explain archive + annotations over a host-injected store.
# 0.2.12 is a RENDERING floor: urn:repo:style reads its themes and contrast floor from the
# layered a11y.toml and lifts every sub-floor colour to the theme's own foreground. Below
# 0.2.11 it also leaked the light theme into dark mode, rendering parameters at 1.03:1.
# Steel-backed Lisp evaluator (urn:lisp:eval): code is a resource, builtins ARE the
# cap-scoped kernel verbs. Embedded-only (arbitrary code); gated by urn:cap:lisp.
ikigai-lisp = "0.1.12" # 0.1.12 = scope_sync migration (core-owned bridge; channels deleted)
ikigai-throttle = "0.1.7" # Timeout governor + Failover (the --prefer mount degrades through it)
# LLM inference (urn:llm:ask + urn:llm:<provider>:ask + urn:llm:config): a facade grammar
# over pluggable backends. OpenAI-compatible REST backend (Ollama/vLLM/llama.cpp/mlx_lm).
ikigai-llm = "0.12" # 0.12 = `caps.batchAt` + the `batchAt<=W` need term: the declared
# concurrency at or above which a backend is the throughput winner, which is what the engine's
# automatic fan-out hint resolves against. An API floor AND a breaking one — `Caps` gained a
# public field, so a caret pin on 0.11 does not reach it. Carries 0.10's
# urn:llm:{provider}:model, which browse's explain archive keys its version tags on.
# Video-conference scheduling (urn:meeting:schedule + urn:meeting:<provider>:schedule): a facade
# over provider backends, Zoom first. Now on crates.io — the git-rev bridge retired at first publish.
ikigai-meeting = "0.1.0"
# The org⊕calendar consolidated-view (Brian-Busy) derivation — a workspace-local
# composition crate that reconciles personal/org/rdf THROUGH the kernel. Not
# published (no version pin); the CLI installs it from this path only.
ikigai-view = { path = "crates/ikigai-view", version = "0.1.14" }
# Timezone conversion (urn:tz:convert, IANA/DST-correct) + a zoned clock (urn:tz:now).
# Workspace-local, not published; keeps the tzdata dependency out of the lean modules.
ikigai-tz = { path = "crates/ikigai-tz", version = "0.1.14" }
# The intray / tuplespace (urn:space:{name}: out/rd). Workspace-local, not published;
# a dir-backed space under file_root. The scheduling booking-inbox drops into it.
ikigai-intray = { path = "crates/ikigai-intray", version = "0.1.14" }
# Outbound email (urn:email:send): a cap-gated Sink submitting over SMTP to a local MTA
# that relays onward. Workspace-local, not published; the contact service and the
# scheduling confirm-link both need it.
ikigai-email = { path = "crates/ikigai-email", version = "0.1.14" }
# Public form intake (urn:*:submit): parse an untrusted urlencoded/JSON body, validate
# declared fields, drop an escaped s-expr tuple into a space. Contact + booking share it.
ikigai-intake = { path = "crates/ikigai-intake", version = "0.1.14" }
# WebAuthn (ES256) assertion verifier: the second factor gating the edge decision links.
ikigai-passkey = { path = "crates/ikigai-passkey", version = "0.1.14" }
# Sibling workspace crates pinned to the current release: a published crate must
# require its siblings at this version too, so the lockstep release publishes in
# dependency order (resolve → wire → engine → …) and a crate can never build against
# an older, incompatible sibling on crates.io.
ikigai-resolve = { path = "crates/ikigai-resolve", version = "0.1.14" } # naming_entry: the most specific catalog row names a target (the engine's trace labels use it)
ikigai-wire = { path = "crates/ikigai-wire", version = "0.1.11" } # v6 hello + ErrorTyped/WireError
# 0.1.16 = `Spawner::width()`: the scheduler answers how many tasks make progress AT ONCE
# (1 for `single`), which is what the engine's fan-out routing sizes itself by. Core
# defaults that method to `None` = unknown, and a caller reading unknown as "wide" is the
# ~1.8x-slower case — so below this floor the routing is silently inert, not merely older.
# 0.1.15 = SchedulerSpec: a spec parsed WITHOUT building, so `--scheduler pool:xyz` is
# rejected while argv is read instead of by spawning a threadpool to find out.
ikigai-scheduler = { path = "crates/ikigai-scheduler", version = "0.1.16" }
ikigai-time = { path = "crates/ikigai-time", version = "0.1.12" } # JobHealth: last_run for staleness
# Inbound HTTP transport (method↔verb, path↔iri, cap-per-request). A published
# transport like ipc/quic/mcp; only the `web`-featured CLI pulls it (and Tokio).
ikigai-web = { path = "crates/ikigai-web", version = "0.1.9" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
libc = "0.2"
# Native HTTP client for the embedded host's ikigai-http transport. Blocking and
# runtime-free, so it works under the CLI's `futures::block_on` without pulling Tokio.
ureq = "2"

