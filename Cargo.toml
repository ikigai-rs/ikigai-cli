[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# 0.1.27 is additive: `ikigai-web` grows `PrincipalFn` / `EdgeConfig::principal_fn`, the identity
# twin of `CapFn` — a door that authenticated a request hands the transport WHO asked, and a
# mutating verb carries it as the `principal` argument beside `received`/`client` (the cli half
# of ledger #76; reserved from the query string like the other two). Every `EdgeConfig` consumer
# builds it with `..EdgeConfig::default()`, so the new field is not a flag day. `None` = 0.1.26.
#
# ⚠ 0.1.26 carries a SECURITY fix, and the published 0.1.25 still has the defect (ledger #79):
# every `urn:time:*` job fired under ROOT, set once when the registry was built, so an attenuated
# caller — an MCP agent above all — could schedule a Sink or Delete against any IRI and it ran with
# full authority. `ikigai-time` 0.4.0 records the capability that scheduled each job and fires every
# tick under `ceiling.clamp(recorded)`; `urn:time:schedule|cancel|jobs` now declare
# `urn:cap:time:schedule|cancel|read`. `ikigai-embedded` names each host job's authority
# (`host_job_authority`). The rest of the workspace moves only because the release is the whole
# workspace (below). ⚠ An MCP grant without the time tokens no longer offers `urn:time:*` at all.
#
# ⚠ 0.1.25 carries a SECURITY-SHAPED wire fix and the published 0.1.24 still has
# the defect (ledger #479, #487). `ikigai-ipc` matched replies to calls
# POSITIONALLY on one stream with no correlation id, and a call that missed its
# read deadline returned `Error::Timeout` while KEEPING the connection — so the
# server's abandoned reply was handed to the next call, well-formed and wrong,
# permanently:
#
#     read a -> Ok("a")   read b -> Err(Timeout)
#     read c -> Ok("b")   read a -> Ok("c")
#
# ★ It is a CAPABILITY defect, not merely a correctness one: a reply computed for
# one request reaches a different request on the same connection, so a host
# multiplexing identities over one standing `IpcResolver` hands one principal's
# answer to another with NO grant consulted — the check already passed, for the
# other request. A Retry overlay makes it worse by consuming the abandoned reply
# and looking like a clean success. `ikigai-quic` was never affected:
# `Wire::attempt` opens a fresh bi stream per call.
#
# ⚠ This version is the whole point of the bump. Until it publishes, every
# consumer of `ikigai-ipc` on crates.io has the defect, and the condition that
# reaches it is routine here — the 30s self-description bound, which plasma's
# own config.toml documents gonk degrading at.
#
# ★ A RELEASE OF THIS WORKSPACE IS THE WHOLE WORKSPACE, published in dependency
# order (`just -f ~/git-personal/ikigai-devtools/justfile registry-drift ikigai-cli`
# prints the order and the verdict). Twice it was not — 0.1.24 shipped only the
# transport chain, 0.1.25 at first only resolve → wire → ipc — and nothing noticed
# for weeks because nothing looked: twelve crates sat two minors behind the tree
# they ship from (ledger #494; Brian: "nothing was intended"). The 0.1.25 catch-up
# wave closed the gap and the daily scan now goes red on any publishable member
# whose tree version is ahead of crates.io. ⚠ So this comment names NO crate as
# behind or ahead — that was a snapshot of the registry, true for one afternoon
# and wrong the next, in the most authoritative place in the tree. Ask the gate.
version = "0.1.27"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-cli"
homepage = "https://github.com/ikigai-rs/ikigai-cli"

[workspace.dependencies]
# The released kernel, consumed from crates.io. For local cross-repo development
# against a sibling checkout, use .cargo/config.toml (see .cargo/config.toml.example).
ikigai-core = "0.1.64" # ★ UNCHANGED at the 2026-09-12 pin sweep, deliberately, and this is
# the worked example for the framing below: 0.1.70 is published and the caret has always
# admitted it, but no source in THIS workspace calls anything added since 0.1.64 —
# `Invocation::with_bindings` and `Space for Arc<S>` (0.1.65), `escape_iri_fragment` /
# `is_iri_safe` (0.1.66), `Kernel::with_cache_policy` and the `cache::*` types (0.1.70) are
# all absent from `crates/`. The lock resolves 0.1.70 and gets the behaviour — the kernel
# joining its own manifold (0.1.67), the lost-cut race and cache eviction (0.1.70) — without
# the pin claiming an API we do not use. Raise it the day a call site appears, not before.
# 0.1.64 = `Resolved.canonical`, the field a `Space` sets when its
# resolution REWROTE the request's target; the kernel adopts that name before it computes the
# cache id and fires the golden-thread cut, so a logical name and its backing name stay ONE
# resource. A hard floor, not a soft one: the field has no default in a struct literal, so an
# older core is a compile error rather than a silent `None`. `ikigai-resolve` reports `None`
# at both of its sites on purpose — see the comment on `MountedRemote::resolve`.
# 0.1.60 = `Spawner::width()`, the read the engine's fan-out routing
# is built on: how many spawned tasks make progress AT ONCE, so a ten-branch fork on the
# default `single` scheduler is known to be one-wide. An API floor — the method is defaulted,
# so an older core compiles and silently answers `None` (= width 1) for every scheduler,
# turning width routing off wherever it would have mattered. 0.1.55's behavioural floor still
# holds beneath it: below that a MOUNTED template row whose local name-guess collides with a
# shorter sibling is dropped from the manifold, so `ikigai mcp` silently stops projecting
# browse-pr-explain and browse-pr-review.
ikigai-vocab = "0.1.70" # 0.1.70 is the first version carrying the PROCESS vocabulary —
# `ik:Process`/`ik:Step`/`ik:Argument`/`ik:Fork`, the plan shapes in `SHAPES`, and the
# `ikigai_vocab::plan` IRI builders — which `ikigai-engine`'s `plan.rs` renders and reads.
# (The terms and the module first appear in 0.1.68; 0.1.70 is what the lock resolves and
# what this repo's tests validate against, so the floor is stated where it is tested.)
#
# Previously 0.1.69, for this reason, which still holds: 0.1.69 defines the six terms the modules composed BELOW already
# serve through this host: `ik:batchAt` (ikigai-llm), `ik:passcode` (ikigai-meeting) and
# `ik:Review`/`ik:orphanedItems`/`ik:reviewedBytes`/`ik:totalBytes` (ikigai-browse). The
# conformance suite's VOCABULARY rule walks THIS host's composed manifold, so an undefined
# term is a finding here rather than in the crate that emitted it —
# `the_health_graph_uses_exactly_four_undefined_terms` pins the exception list exactly, and it
# is four, not ten, only from 0.1.69.
#
# ⚠ There is a SECOND vocab floor in the ecosystem — 0.1.40 is the first version whose
# `TurtleRenderer` answers `Meta as=application/json` instead of ERRORING — and this host is
# NOT subject to it, which is worth writing down because it looks like it should be.
# `ikigai_embedded::CliRenderer` projects the JSON face ITSELF and only falls through to
# `TurtleRenderer` for Turtle and text, so every kernel built here answers a contract fetch
# whatever vocab is resolved beneath it. The floor binds a PEER we mount that renders Meta
# with a plain `TurtleRenderer`, and it bites at `Engine::describe_struct`, which fetches the
# contract with exactly that request and fails OPEN when it cannot — returning `None`, so
# `source_request` routes the value to an input literally named `in` and every pipe over
# `--connect` appears to work while named arguments are silently not recognised as named.
# So: raise this pin for the terms, and remember the 0.1.40 number when a MOUNT misbehaves.
# (0.1.33 = event terms ik:calendar/allDay/alert + the LLM trait terms.)

# ── ★ What a pin means HERE, because this crate is a HOST and not a library ──────────────
#
# Constitution rule 5 says a pin states the true minimum API you use. For a library consumer
# that is the set of Rust items it calls. **This crate's product is the composed manifold** —
# `urn:kernel:catalog`, the capability-scoped `urn:kernel:actions`, the MCP tool list, the
# `describe` face every client and every agent reads. A module's `describe()` is therefore
# part of THIS crate's observable output, and `crates/ikigai-embedded/tests/conformance.rs`
# asserts on it over both compositions. A declaration fix in a module is consequently an API
# floor here in a way it is not for a library that merely calls the module's Rust functions.
#
# That is the reason most of the pins below moved in one pass on 2026-09-12, and each still
# says which specific defect it is the floor for. It is NOT a licence to pin the newest: where
# a release changed nothing this host serves or calls, the pin stays where it was and says so
# (`ikigai-core`, below, is the worked example).
#
# ⚠ The OTHER half, which no pin can state and which is what actually kept the fixes out:
# **this repo COMMITS `Cargo.lock`, so CI builds the graph we froze and an upstream fix is
# invisible here by construction** (constitution 9e). Every caret below already admitted the
# newest published version on the day this was written — not one of the twenty-five pins was a
# CEILING. The lock alone was holding `ikigai-fn` at 0.2.0 and shipping a manifold that
# contradicted itself. Refresh the lock when you touch these, and diff the lock FILE.
# The reusable function library, linked in as a published module crate.
ikigai-fn = "0.2.2" # 0.2.2 REMOVED `urn:iki:fn:compose`'s `.output("text/html")`. The
# declaration was a guess and it was false — compose serves the SOURCE's media type, which
# is what its own summary said all along, so the manifold this host publishes contradicted
# itself on one endpoint. Held out for two releases purely by the committed lock: the caret
# admitted 0.2.2 from the day it was published, and the signed `ikigai` 0.1.20 on this
# machine still emitted the false face. 0.2.1 typed every ArgSpec (`src` and the conditional
# trio as xsd:anyURI), which is what makes these endpoints visible to the selection funnel's
# `urn:kernel:actions types=` narrowing at all.
# 0.2.0 = the namespace this library owns moved to `urn:iki:fn:*`
# (toUpper/reverseList/compose/conditional). A HARD floor: the old names are not bound at all
# by 0.2.0, so a lower pin resolving here would leave this host's alias rule rewriting every
# `urn:fn:` request to a name nothing binds — the reverse trap, and it fails at runtime, not
# at compile time. `urn:demo:*`, `urn:data:page` and `urn:host:info` deliberately did NOT move:
# they are bound in several repos and a shared prefix cannot migrate one binder at a time.
# Personal contexts (urn:personal:*), macOS-backed, linked as a published module.
ikigai-personal = "0.7.1" # 0.7.1 = multi-day events block every spanned day (free/busy + booking); notes/URL/attendees on the graph face + description= Sink (detail preservation)
# Capability-gated file/store module, linked as a published module crate.
ikigai-fs = "0.1.6" # 0.1.6 joins the Exists answer to the READ's golden thread inside
# `cacheable_space` — one Sink or Delete now cuts every representation of the file rather
# than the bytes only, so a cached Exists cannot outlive the file it answered about. A floor
# with two named sites in this workspace, both of them `ikigai_fs::cacheable_space`:
# `foaf.rs` (the door's document store) and the conformance fixture kernel. The default
# live mount is unchanged, so nothing else here moves.
# 0.1.5 = path declared as Binding input (urn:file/orgfile rows in urn:kernel:actions)
# Outbound HTTP-client module (urn:httpGet…), linked as a published module crate.
ikigai-http = "0.1.8" # 0.1.8 = every input of the six verbs had been declared REQUIRED —
# `authorization`, `range`, `headers` and the rest. `ikigai-mcp` projects `required` straight
# into each tool's `inputSchema`, so this host was telling every agent that an optional
# header was mandatory; forty inputs also gained classes (`url` xsd:anyURI, `max_age`
# xsd:nonNegativeInteger) and `httpHead` now declares the text/plain it always served.
# 0.1.7 = endpoint-owned redirects (transport must not follow; SSRF hardening)
# Interactive runbook module (urn:runbook:*) — Linked Data demo tab since 0.1.3;
# 0.1.5 adds the JSON-LD demo tab (expand/flatten/compact), which works here because
# the CLI links its own pipe-fixed ikigai-engine.
ikigai-runbook = "0.1.14" # 0.1.14 DECLARES the text/plain and application/json faces the
# pages have served since 0.1.1 and never announced, and makes `as` optional (it always was,
# in the body) with its real one_of and default. Undeclared-but-served is precisely the class
# `ikigai-conformance` 0.2.0 added a check for, and this host is what serves these pages.
# 0.1.13 added `hide_tab`/`tab_ids`, which this workspace does not call yet.
# 0.1.12 Lisp page: + generated aliases (named verbs, cap-scoped, transcluded)
# Linked Data toolkit (separate ikigai-linkeddata repo): RDF transreption + SPARQL.
ikigai-rdf = "0.1.8" # 0.1.8 = `urn:rdf:transrept` declares all seven faces it produces
# (its outputs and its transreptsTo set are pinned equal upstream), and `mode=` carries its
# one_of/default. 0.1.9 is a dev-dependency bump for this crate only, so 0.1.8 is the true
# minimum rather than the newest. 0.1.3 = + urn:rdf:union / urn:rdf:diff (graph set ops,
# with= carries ?k=v args)
ikigai-sparql = "0.1.9" # 0.1.9 REFUSES an `as=` it cannot serve, naming the target and the
# accepted list, where `serialize_results` used to substitute in silence — `as=text/turtle`
# on a SELECT fell back to JSON and the caller was never told. Every SPARQL call in this
# workspace (`route_load.rs`, one `urn:sparql:select` for the RDF route table) passes NO
# `as=` and takes the declared default, so the refusal changes nothing here and the floor is
# about what this host tells its callers. 0.1.7 also bound `urn:sparql:update` under
# `space_with_store` — which the browse composition uses — behind `urn:cap:sparql:update`.
# 0.1.6 = space_with_store (shared-store seam for browse/annotations)
# Content sniffing + sniff-and-dispatch (urn:sniff, urn:transrept:auto).
ikigai-sniff = "0.1.9" # 0.1.9 sniffs a leading `<urn:…>` subject as text/turtle. Below it
# `angle_token_is_iri` tested for `://` — an AUTHORITY, not a scheme — so every Turtle
# document whose first subject is a URN sniffed as application/rdf+xml and died in the XML
# parser. This ecosystem skolemizes into `urn:` by rule (`urn:ikigai:endpoint:*`,
# `urn:event:*`), so that is most of the graphs this host emits, and it broke
# `source <urn: graph> | urn:rdf:transrept` and `urn:transrept:auto` — both bound here.
# 0.1.9 also declares `urn:transrept:auto`'s own text/turtle face and refuses an unknown `as=`.
# Neutral s-expr foundation: Sexpr datum + urn:sparql:from-sexpr transreptor (text/x-sexpr → SPARQL).
ikigai-sexpr = "0.1.3" # 0.1.3 bounds the reader and the code-graph encoder at
# MAX_READ_DEPTH 512 and answers a clean parse error. Below it, hostile input (`"("` a
# hundred thousand times, or a long flat list) aborted the WHOLE PROCESS on a stack
# overflow — and it got there through CAPABILITY-FREE transreptors, so no grant stood in
# the way and `urn:transrept:auto`, which this host binds and dispatches by sniff, was a
# reachable path to it. A hard floor for a host that serves untrusted bytes.
# 0.1.1/0.1.2 added `urn:rdf:from-sexpr` and the lossless code-as-graph codec
# (`urn:sexpr:to-rdf`/`from-rdf`), both of which this host binds.
# Signing + verification: urn:sign:sign (cap-gated) / urn:sign:verify (open), Ed25519.
ikigai-sign = "0.2.2" # 0.2.2 fixed the key ArgSpec summaries, which had said Ed25519-only
# since ES256 shipped in 0.2.0 — a manifold this host publishes describing an argument it
# does not have, and the same family of defect as the `ikigai-fn` one above. It also makes a
# signature as cacheable as its KEY, so over a key served under a thread a rotation's cut
# recomputes it and over an uncacheable key nothing caches.
# ⚠ 0.2.1 changed the signature NODE IRI from `urn:sign:<hex>` to `urn:sign:sha256:<hex>`
# (the derivation is unchanged). Nothing in this workspace stores or matches that IRI —
# `tests/wire_eval.rs` round-trips through `urn:sign:sign` and `urn:sign:verify` and reads
# the graph, never the node name — but anything downstream that persisted the old spelling
# does not match after this bump.
# Public-key encryption (urn:encrypt:encrypt/decrypt, age/X25519) — the dual of sign.
# Keys resolved through the kernel (urn:secret:<id>.enc). Embedded-only (off the wire).
ikigai-encrypt = "0.1.1" # 0.1.1 stops declaring `urn:encrypt:encrypt` cacheable. age mints
# a FRESH ephemeral key on every call, so the result is not a function of its inputs and a
# cached ciphertext is a cached answer to a question nobody asked twice; `decrypt` is as
# cacheable as its key, which is the correct claim. This host served the cached one.
# Secrets custody: urn:secret:{name} (cap-gated read) + urn:secret:generate/unlock
# (Ed25519 keygen + Touch ID), macOS Keychain backend. Owner-only, not served.
ikigai-secret = "0.1.6" # 0.1.6 gives `urn:secret:{name}` per-verb ActionSpecs — Source under
# `urn:cap:secret:read:*`, Sink under `urn:cap:secret:write:*` with a required, typed
# `content`. The Sink shipped in 0.1.5 with NO `describe()` line at all, so the write face
# existed and was undrivable from `urn:kernel:actions` and from this host's MCP projection:
# enforcement without declaration, the converse of over-offering and the worse of the two.
# `urn:secret:unlock` and `urn:secret:generate` are now bound as their OWN endpoints ahead of
# the template, each with its own scope, so `into=`/`type=` no longer ride on every secret
# read. ⚠ That re-binding is why `tests/conformance.rs` grew two more opt-outs — see the note
# there: a hazard waiver keyed on an endpoint ID does not survive the module splitting it.
# 0.1.5 = the urn:secret Sink write face (owns the item's ACL → silent reads)
# XSLT transform module (urn:xslt:transform) — linked natively (no download cost in a
# native binary; the dynamic/lazy form is a browser/WASI concern).
ikigai-xslt = "0.1.2" # 0.1.2 DECLARES `content`, which the endpoint already read. That is
# pipeline citizenship and it is load-bearing in THIS workspace specifically: the engine
# routes a piped body by the declared contract, so an undeclared intake is an endpoint you
# cannot pipe into from the REPL. It also makes `as` optional and takes the result's media
# type from the stylesheet's `xsl:output` when `as` is absent, where it previously always
# claimed text/html, and accepts a stylesheet inline as well as by IRI.
# JSON-LD operators (urn:jsonld:expand/compact/flatten) — linked natively (the heavy
# json-ld tree is a browser-wasm concern, lazy-loaded there; native links it directly).
ikigai-jsonld = "0.1.2" # 0.1.2 types `content`/`context`/`base`. Untyped inputs are
# invisible to the selection funnel's deterministic first stage — `urn:kernel:actions`
# narrows on `ik:class`, and this host is the thing that serves that manifold — so the three
# operators could not be narrowed to before matching fell through to the LLM residual.
# SHACL validation (urn:shacl:validate) — rudof's validator is native-only (gated off wasm),
# so it's linked natively here; the browser serves the same resource via shacl-engine (JS).
ikigai-shacl = "0.1.2" # 0.1.2 SKOLEMIZES the report graph under `urn:ikigai:shacl:report:`
# instead of emitting blank nodes — the recipe's "skolemize, no blank nodes" rule, in a graph
# this host serves from `urn:shacl:validate` and from the pre-flight leg of the selection
# funnel. Its application/json face also gained `message` (the resolved, language-tagged
# sh:resultMessage) and `value`, and `{?value}`/`{$value}`/`{?this}`/`{?path}` templates are
# now resolved on BOTH faces — authored by shape writers since forever and never once seen.
# 0.1.1 = compiles against shacl 0.3.17+ (validate() grew a 3rd arg in a PATCH release) + real upper bounds
# The org-mode agenda (urn:org:agenda:{period}) — reads org files through the
# kernel (urn:orgfile:*) and speaks the same skolemized event graph as the
# calendar, so the two union/diff as graphs.
ikigai-org = "0.1.7" # 0.1.7 makes the text/turtle face a DECLARED output with `as` listing
# its faces, and declares the agenda cacheable. The caching claim is only safe on a host that
# actually cuts the org files' threads, which this one does — `tests::the_watcher_cuts_a_
# thread_on_an_out_of_band_change` is that guarantee — so an absolute period now caches under
# those threads and the clock instead of recomputing every read.
# 0.1.6 = drawer properties are read wherever the drawer sits (:ID:/:URL: below SCHEDULED:) + :ZOOM_PASSCODE:
# Unix-like text endpoints (urn:text:wc/head/tail/grep/sort/uniq/nl/rev) — the
# first satellite-built module; pure text, wasm-clean, ArgSpec showcase.
ikigai-text = "0.1.1" # 0.1.1 types `in`/`count`/`pattern` and declares all eight endpoints
# pure and cacheable. Same reason as ikigai-jsonld above — an untyped input is invisible to
# `urn:kernel:actions` narrowing — and upstream calls the typing "a contract change consumers
# can see", which for a host is the literal truth: it is in our catalog.
# Semantic-CMS transreptors (urn:cms:*): personal content (org bookmarks/notes,
# library metadata) as one RDF graph on the dc:subject tag axis.
ikigai-cms = "0.1.3" # 0.1.2 SKOLEMIZES the bookmark subject to
# `urn:cms:bookmark:<fnv1a-of-url>` and carries the URL as a `dc:identifier` literal. Using
# the raw URL as the subject meant a bookmark with a bare `%` or a stray `#` produced an
# INVALID subject IRI in a graph this host emits. 0.1.3 declares the Turtle face and marks
# the endpoint pure and cacheable.
# ⚠ This is a GRAPH-SHAPE change, not just a declaration: any query keyed on the bookmark
# URL being the subject has to move to `dc:identifier`. Nothing in this workspace queries
# `urn:cms:*` — it binds the transreptors and serves them — but ikigai-cms-web does.
# 0.1.1 = stitch wrapped bookmark titles (no dropped entries)
# Dev-tooling seam: git/gh/cargo as resources (urn:system:exec, urn:repo:*).
ikigai-repo = "0.1.6" # A floor a test in this repo actually holds, rather than an argument:
# 0.1.3 and 0.1.5 bound `urn:repo:pr:list`, `urn:repo:pr:diff` and `urn:repo:pr:files`, and
# `conformance::the_walked_catalog_is_classified` now names all three. Below 0.1.6 they are
# unbound and that test fails the other way — "classified but no longer bound". 0.1.4 also
# gave `pr:list` a `state=` enum refused before `gh` runs, and 0.1.6 typed twenty-three
# inputs while deliberately declaring nothing pure or cacheable (every one of these shells
# out). ⚠ `pr:list`'s TEXT face gained a `state` column and now orders by most-recently-
# UPDATED rather than newest-created; nothing in this workspace parses it, but a line parser
# written against 0.1.3 breaks. 0.1.2 = typed Error::Denied for capability denials
# Repository browsing (urn:repo:{root}:tree/file/state/hash/explain +
# urn:iki:annotation:*) over configured roots — opt-in via `browse.root` config lines
# (embedded host).
ikigai-browse = "0.5.0" # 0.5.0 (ledger #444) is a BEHAVIOURAL break this host does not use but
# must not be frozen below: `urn:repo:{repo}:review:{path}` stops minting annotations and
# produces PENDING findings instead, promoted only by a human, and the review actions stop
# declaring `urn:cap:annotate` because they no longer write annotations. This host binds browse
# through `space_with_explain`, compiles clean against it with no code change, and has no test
# that asserts a review mints anything — so the break costs nothing here. ⚠ The pin moves anyway,
# because `^0.4.0` means `<0.5.0`: left alone it would have silently ceilinged this host out of
# every browse release from here on, which is how `ikigai-dev-server` served the 0.10 line of
# `urn:llm:*` for two minor releases (rule 5's second half). A floor argued in detail is exactly
# the shape that hides a ceiling nobody stated — see the paragraph below, which is that shape.
# ⚠ `Cargo.lock` is tracked here, so the caret alone would not have delivered 0.5.0 either
# (ledger #461); the lock moves in this commit.
#
# 0.4.0 remains A READ-CONFINEMENT floor, and it is about THIS host's COMPOSITION
# rather than about an API we call. Through 0.3.2 every browse read passed `None` for the
# graph, which in `quads_for_pattern` means EVERY graph in the store — while this host loads
# the bundled vocabulary into the NAMED graph `urn:ikigai:vocab` in that same shared store
# (`ikigai_sparql::load_vocabulary`, called from `crates/ikigai-embedded/src/browse.rs`). So
# browse's reads have been scanning another writer's graph in production. Nothing ever
# matched — no vocabulary subject is an `oa:Annotation` — which is luck about the data, not a
# property of the code. 0.4.0 is the first version whose reads are confined to the mount's
# graph; for a mount that names none, that is the DEFAULT graph, which is where browse has
# always written. `crates/ikigai-embedded/tests/browse_graph.rs` holds the confinement over
# this host's own composition, with a decoy annotation planted in the vocabulary graph.
# ⛔ This host deliberately does NOT call `Mount::graph`. Naming a graph is an opt-in that
# owes four things browse documents — the `migrate-annotation-ns --graph` run (or the archive
# reads EMPTY), narrow `urn:cap:store:{read,write}:graph:<iri>` grants, a redone freshness
# argument, and any cross-graph query rewritten — and none of that is prepared here. Default
# is what this host had, byte for byte; only the cross-graph reads stop.
# 0.3.2 declares `content` on the annotation Sink — the piped body was
# undeclared, and on this host the engine routes a pipe BY the declaration, so minting an
# annotation from a pipe was not a thing the REPL could do. It also fixes three `as` defaults
# that were not members of their own `one_of` (a contract that cannot be satisfied by taking
# its own default) and types thirty-four inputs.
# 0.3.2 also added `Mount::space_watched() -> (EndpointSpace, StyleWatch)`, which is what
# would finally cut `urn:file:<a11y.toml>`'s thread on an out-of-band edit — this host still
# calls `space_with_explain`, so `urn:repo:style` keeps serving the stylesheet the process
# started with. Adopting the watch is a code change, not a pin, and is left to its own arc.
# 0.3.1 added the `migrate-annotation-ns` tool for stores written before the 0.3.0 rename.
# 0.3.0 is a NAMING floor, and the reason it is hard rather than
# cosmetic: the annotation family moved from `urn:annotation:*` to `urn:iki:annotation:*`,
# and this host answers the OLD spelling through the alias table installed in
# `ikigai_embedded::alias_table` (see the two rules there). Pinned below 0.3.0 the host
# would alias `urn:annotation` onto a name nothing binds — every annotation read and every
# mint Unresolved, with the table reporting a clean rewrite. Bump and alias travel together.
# 0.2.12 was a RENDERING floor: urn:repo:style reads its themes and contrast floor from the
# layered a11y.toml and lifts every sub-floor colour to the theme's own foreground. Below
# 0.2.11 it also leaked the light theme into dark mode, rendering parameters at 1.03:1.
# Steel-backed Lisp evaluator (urn:lisp:eval): code is a resource, builtins ARE the
# cap-scoped kernel verbs. Embedded-only (arbitrary code); gated by urn:cap:lisp.
ikigai-lisp = "0.1.15" # Two floors, both behavioural, both with named sites here.
# 0.1.13: Steel keeps ONE module-global reader that never cleared on a mid-form eof, so a
# single malformed input left a partial form in it and POISONED every later `read` in that
# worker for the life of the process. This host runs `urn:lisp:eval` on a long-lived worker,
# which is exactly the shape that turns one bad input into a permanent fault.
# 0.1.15: a capability denial inside a sub-resolution propagates as a TYPED `Denied` instead
# of `Error::Endpoint("lisp: Error: Generic: \"denied: …\"")`. That matters at this
# workspace's own boundaries and nowhere else: `ikigai-wire` v7 carries typed errors, and a
# client reads `Endpoint` as RETRYABLE — so a permanent authority refusal came back over IPC
# and QUIC as something worth trying again, and the HTTP face mapped it to 500 rather than
# 403. 0.1.12 = scope_sync migration (core-owned bridge; channels deleted)
ikigai-throttle = "0.1.10" # 0.1.10 = the over-budget `RateLimit` stand-in FORWARDS the
# wrapped endpoint's `describe()`. Below it the stand-in described itself ("rate-limited",
# no `requires`), so once a prefix went over budget the wrapped endpoint's declared-capability
# floor vanished with it: a caller holding no grant for a gated resource was told the prefix
# was rate-limited instead of being Denied, and this host's catalog through an overlay
# advertised no `requires` at all. Declared = enforced is the rule the overlay was breaking,
# and this workspace is where the overlays are composed. The refusal itself is unchanged.
# 0.1.9 = each `Failover` candidate is invoked on its OWN grammar's
# captures. A behavioural floor with a named site right here: `--prefer` composes
# `Failover::new([MountedRemote, local])` (see `crates/ikigai-embedded`), and `MountedRemote`
# hits with `Bindings::new()`. Under 0.1.8, which invoked EVERY candidate with the first hit's
# bindings, the local fallback therefore lost its own captures on exactly the degradation path
# the mount exists for — `urn:codekey:{path}` reads `inv.bindings.get("path")` and would answer
# MissingArgument instead of the key. Nothing catches it: the types are identical, and the
# branch only runs when the peer is down. The caret alone would not have delivered the fix
# either — `Cargo.lock` was frozen on 0.1.8. This floor raises `ikigai-core` to 0.1.65
# transitively (0.1.9 needs `Invocation::with_bindings`); the core pin above stays at 0.1.64
# because no source in THIS workspace calls a 0.1.65 API, and a pin states the minimum you use.
# 0.1.8 = the overlays answer `Resolved.canonical` (core 0.1.64). A HARD
# floor, and the reason is the registry rather than this workspace: 0.1.7's six `Resolved`
# literals predate the field, so with core resolved at 0.1.64 the published 0.1.7 source does not
# compile at all. A caret pin cannot save it — cargo unifies core to one version across the
# graph, so the throttle floor and the core floor move together. Semantically the overlays are
# transparent to identity — each FORWARDS the canonical its inner resolution reported, so an
# `Alias` composed beneath a governor keeps the logical and the backing name on one cache entry
# and one golden thread. `Failover` is the stated exception: it holds every hit and defers the
# choice past the point the cache key is derived, so it reports a canonical only when all its
# targets agree on one and `None` when they disagree.
# Timeout governor + Failover (the --prefer mount degrades through it)
# LLM inference (urn:llm:ask + urn:llm:<provider>:ask + urn:llm:config): a facade grammar
# over pluggable backends. OpenAI-compatible REST backend (Ollama/vLLM/llama.cpp/mlx_lm).
ikigai-llm = "0.12.1" # 0.12.1 stops a backend's 4xx body reaching the error text verbatim —
# only the OpenAI-shaped `error.message` is kept — so a PROMPT can no longer appear in an
# error this host composes and relays over the wire. In the same release `require_net`
# refuses with the typed permanent `Denied` instead of `Error::Endpoint`, which a wire client
# reads as retryable (the same defect, and the same reasoning, as the ikigai-lisp floor
# above), and `urn:llm:config`/`:models`/`:select` become cacheable under ONE golden thread,
# `urn:llm:config`, so a host that reloads config cuts that thread once. ⚠ This host does not
# cut it today — a live config reload will serve stale llm answers until the process
# restarts. 0.12.2 is the xsd-typed `ik:batchAt` literal, which matters to a consumer
# diffing the Turtle face against the JSON-LD one; nothing here does, so this pin states
# 0.12.1 rather than the newest.
# 0.12 = `caps.batchAt` + the `batchAt<=W` need term: the declared
# concurrency at or above which a backend is the throughput winner, which is what the engine's
# automatic fan-out hint resolves against. An API floor AND a breaking one — `Caps` gained a
# public field, so a caret pin on 0.11 does not reach it. Carries 0.10's
# urn:llm:{provider}:model, which browse's explain archive keys its version tags on.
# Video-conference scheduling (urn:meeting:schedule + urn:meeting:<provider>:schedule): a facade
# over provider backends, Zoom first. Now on crates.io — the git-rev bridge retired at first publish.
ikigai-meeting = "0.1.1" # 0.1.1 runs the module's OWN rules — both Zoom hosts, port-aware,
# and each credential name — BEFORE any secret is read. The original read all three secrets
# and then let its net gate refuse, so a call that was never going to be allowed had already
# touched the keystore. It also declares `urn:cap:net:*` + `urn:cap:secret:read:*` on the
# Sink (they were enforced and undeclared), declares `content`, types every input so a
# garbled `start`/`duration` is a typed InvalidArgument that names the argument without
# echoing it, and scrubs provider errors.
# The persistent RDF store (urn:iki:store:*): a dataset opened from a path and owned by
# ONE process, rather than rebuilt from its sources on every boot. Optional, behind this
# workspace's `store` feature (ikigai-embedded), because a host that wants no dataset
# should carry none — and because the ledger that rides on it is opt-in too.
#
# `features = ["persistent"]` is the whole point of taking this dependency: the crate is
# in-memory by DEFAULT and the durable backend lives behind a `cfg(feature)` inside a
# LIBRARY, which is not a target, so nothing — not `--all-targets`, not `ci-drift`'s
# required-features check — would report its absence. Without it `DurableStore::open` does
# not exist and this host would compile against a store that forgets.
#
# ⚠ And the RocksDB it enables is ALREADY in this workspace's graph unconditionally:
# `ikigai-embedded` turns on `oxigraph/rocksdb` for the browse/sparql shared store, so
# `oxrocksdb-sys` compiles on every default build here whatever this line says. Cargo
# feature unification is global, so the two cannot disagree. (Measured 2026-09-13:
# `oxrocksdb-sys` is in this repo's Cargo.lock on main, before this dependency existed.)
#
# 0.2.0 is the floor AND the first version that exists to depend on: 0.1.70 was the
# in-memory placeholder a lockstep sweep published by accident and Brian yanked.
# ⚠ `"0.2.0"` is a RANGE, `>=0.2.0, <0.3.0` — when the store reaches 0.3 this line must
# move or this host silently freezes out of every release after it.
# ⚠ 0.2.2, not 0.2.0: that is where the store's NARROW per-graph doors arrive
# (`urn:iki:store:graph-select` / `graph-update`, gated by
# `urn:cap:store:{read,write}:graph:<G>`), and every read and write `ikigai-ledger` makes
# goes through them. Nothing in this host calls them directly — the floor states the API
# the COMPOSITION uses, which is the same rule read one level out.
# ⚠ …and 0.2.3, not 0.2.2, because 0.2.2 DOES NOT COMPILE here — the strongest form a
# floor can take. `term_to_json` matched `oxrdf::Term` exhaustively without the RDF-star
# arm, true of the store's own graph and false under Cargo's global feature unification:
# this workspace pulls rudof through `ikigai-shacl`, which enables `oxigraph/rdf-12` →
# `oxrdf/rdf-12`, so `Term::Triple` exists and the match is non-exhaustive. The store's own
# CI passes `features: "persistent"` and never sees it. A floor of 0.2.2 would be a floor
# on a version no consumer of this workspace can build.
ikigai-store = { version = "0.2.3", features = ["persistent"] }
# The work ledger (`urn:iki:ledger:*`): items, comments, labels, links, claims and
# `next`, as RDF in the store above. It owns no bytes — every read is a scoped SPARQL
# query at `urn:iki:store:graph-select` and every write a scoped UPDATE at
# `urn:iki:store:graph-update` — so it is inert without a store space in the same kernel,
# and the two are bound together or not at all (`crates/ikigai-embedded/src/store.rs`).
#
# ⚠ `"0.2.1"` is a RANGE, `>=0.2.1, <0.3.0`. 0.1.0 named every resource and every grant
# differently (`urn:iki:ledger:append` was the only ledger there was), so this host has
# never seen those IRIs and must not resolve against them — and 0.2.0 compiles but is
# WRONG here: `urn:iki:ledger:{ledger}:item:{id}` over-declared the broad
# `urn:cap:store:read` on its `Source`/`Exists`, so a session holding exactly the list
# `store::grants_for` issues could file an item and list the ledger and was DENIED on
# reading one item back. The floor states the behaviour the composition depends on, which
# is what `tests/ledger.rs::the_narrow_per_graph_grants_work_and_the_broad_store_key_does_not`
# now exercises end to end.
ikigai-ledger = "0.2.1"
# ── Intra-workspace siblings: LOCKSTEP pins, not floors ───────────────────────
# The seventeen members that take `version.workspace = true` are released TOGETHER, at one
# version, always. So every sibling pin below states the CURRENT workspace version rather
# than the oldest published sibling whose API is actually called.
#
# This does not break "a pin states the true minimum API you use" (constitution rule 5) —
# it is that rule applied to a set that ships as a unit, so please do not "fix" it back.
# A floor lets cargo resolve `ikigai-cli 0.1.17` against `ikigai-ipc 0.1.16`: a combination
# NOTHING HAS EVER BUILT. In-tree the path dependency always wins, so the version half is
# never exercised here; off-tree, same-version-across-the-set is the only combination that
# has ever been packaged, published or tested. For a lockstep set the lockstep version IS
# the true minimum — the floor is not a weaker claim than it, it is a DIFFERENT and untested
# one. And it was reachable, not theoretical: `just release ikigai-cli` reported READY while
# ipc, quic, wire and embedded were still at 0.1.16, with nothing to stop a cli 0.1.17
# shipping against 0.1.16 siblings.
#
# The per-pin notes are kept as API HISTORY: they record which release first carried the API
# named, which is what a reader needs when asking whether an older sibling would compile at
# all. They no longer set the number.
#
# ⚠ Consequence for the release ritual: a lockstep bump now edits SEVENTEEN sibling pins
# across three manifests (this one, crates/ikigai-cli, crates/ikigai-embedded) on top of
# `workspace.package.version`. `crates/ikigai-cli/tests/lockstep_pins.rs` is what makes those
# seventeen non-optional rather than remembered — the drift that produced this defect ran for
# eight releases and the only thing that ever noticed was a comment.
#
# `ikigai-time` is the ONE exception; its own note below says why.

# The org⊕calendar consolidated-view (Brian-Busy) derivation — a composition crate
# that reconciles personal/org/rdf THROUGH the kernel. Published since 0.1.14 (#296):
# ikigai-embedded depends on it, and a path-only dependency makes every crate above it
# in this workspace unpublishable, the `ikigai` binary included.
ikigai-view = { path = "crates/ikigai-view", version = "0.1.27" }
# Timezone conversion (urn:tz:convert, IANA/DST-correct) + a zoned clock (urn:tz:now).
# Published since 0.1.14 (#296); keeps the tzdata dependency out of the lean modules.
ikigai-tz = { path = "crates/ikigai-tz", version = "0.1.27" }
# The intray / tuplespace (urn:space:{name}: out/rd). Published since 0.1.14 (#296);
# a dir-backed space under file_root. The scheduling booking-inbox drops into it.
ikigai-intray = { path = "crates/ikigai-intray", version = "0.1.27" }
# Outbound email (urn:email:send): a cap-gated Sink submitting over SMTP to a local MTA
# that relays onward. Published since 0.1.14 (#296); the contact service and the
# scheduling confirm-link both need it.
ikigai-email = { path = "crates/ikigai-email", version = "0.1.27" }
# Public form intake (urn:*:submit): parse an untrusted urlencoded/JSON body, validate
# declared fields, drop an escaped s-expr tuple into a space. Contact + booking share it.
# API history — 0.1.17 = `IntakeField::max_len` and `IntakeField::legacy` (#300, the bounded
# booking door). That was the API floor, and for one release it coincided with the lockstep
# version; the pin above now states the lockstep version, which is at or above it.
# A HARD floor, and one the workspace build cannot see: inside this tree the path
# dep always wins, so `cargo test` is green against a pin that no published version
# satisfies. It surfaces only when a member is PACKAGED, where the path is stripped and
# the caret resolves against the registry — `^0.1.14` picked the live 0.1.16, which
# predates both methods, and ikigai-embedded failed to verify with four E0599s. Nothing
# else catches this: the gates pass, CI passes, and the break waits for release day.
ikigai-intake = { path = "crates/ikigai-intake", version = "0.1.27" }
# WebAuthn (ES256) assertion verifier: the second factor gating the edge decision links.
ikigai-passkey = { path = "crates/ikigai-passkey", version = "0.1.27" }
# Sibling workspace crates pinned to the current release: a published crate requires
# its siblings at this version too, so ANY subset of the workspace can publish in
# dependency order (resolve → wire → engine → …) and a crate never builds against an
# older, incompatible sibling on crates.io. ⚠ That lockstep is a property of the TREE
# — `crates/ikigai-cli/tests/lockstep_pins.rs` enforces it here — and says nothing
# about the REGISTRY, which only matches the tree after a full wave. The two parted for
# weeks without anything saying so (ledger #494); `registry-drift` is what says so now.
ikigai-resolve = { path = "crates/ikigai-resolve", version = "0.1.27" } # naming_entry: the most specific catalog row names a target (the engine's trace labels use it)
ikigai-wire = { path = "crates/ikigai-wire", version = "0.1.27" } # v6 hello + ErrorTyped/WireError
# API history — 0.1.16 = `Spawner::width()`: the scheduler answers how many tasks make progress AT ONCE
# (1 for `single`), which is what the engine's fan-out routing sizes itself by. Core
# defaults that method to `None` = unknown, and a caller reading unknown as "wide" is the
# ~1.8x-slower case — so below this floor the routing is silently inert, not merely older.
# API history — 0.1.15 = SchedulerSpec: a spec parsed WITHOUT building, so `--scheduler pool:xyz` is
# rejected while argv is read instead of by spawning a threadpool to find out.
ikigai-scheduler = { path = "crates/ikigai-scheduler", version = "0.1.27" }
# ⚠⚠ EXEMPT from the lockstep above — deliberately, and this pin must NOT be raised to the
# workspace version. ikigai-time is the eighteenth member and the only one that does not take
# `version.workspace = true`: it declares its own `version` in its own manifest and is
# published on its own line, because the Clock change below was a BREAKING API change that
# earned a major bump the other seventeen had no reason to take (and 0.3.0 and 0.4.0 took
# two more). That line's version is therefore its current release; `0.1.17` would name a version of ikigai-time that does not exist on
# crates.io and never will. That one, unlike a stale floor, is loud: cargo checks a path
# dependency's declared version against the requirement, so `0.1.17` here stops the whole
# workspace resolving ("candidate versions found which didn't match: 0.2.0") before anything
# compiles. It is exactly the asymmetry that let the floors rot unseen — a requirement too
# HIGH fails immediately, a requirement too LOW is satisfied by the path dep and says nothing.
# The exemption is encoded BY NAME in `crates/ikigai-cli/tests/lockstep_pins.rs`, which
# checks this pin against ikigai-time's own declared version — so the two cannot drift, and
# if ikigai-time ever rejoins the lockstep the test says to delete the exemption.
# 0.4.0 = a job fires under the capability that SCHEDULED it, clamped to the registry's
# ceiling, instead of the registry's root (ledger #79). `schedule`/`schedule_persistent` take a
# required `capability`, so ikigai-embedded's four host jobs now name theirs
# (`host_job_authority`), and `urn:time:*` declares `urn:cap:time:{schedule,cancel,read}`. A
# hard floor, and a security one: every 0.3.x fires every job at root.
# 0.3.0 = `JobHealth` gains `last_success`, `since_last_success` and `failures_in_a_row`,
# and `JobRegistry::with_sleep_clock` takes the host's `Arc<dyn SleepClock>` (#334). Public
# STRUCT FIELDS, so anyone constructing a `JobHealth` literal breaks — a major bump under
# 0.x, the same reason 0.2.0 took one. ikigai-embedded reads all three fields and installs
# `HostSleepClock`, so this is a hard floor here.
# 0.2.0 = `JobRegistry::new` takes the host's `Arc<dyn Clock>`. A hard floor, not a
# preference: 0.1.x stamps `last_run` with `std::time::Instant::now()`, which panics on
# wasm32-unknown-unknown under the registry lock and bricks the registry for the life of
# the process. (0.1.12 gave the older need: JobHealth::last_run for staleness.)
ikigai-time = { path = "crates/ikigai-time", version = "0.4.0" }
# Inbound HTTP transport (method↔verb, path↔iri, cap-per-request). A published
# transport like ipc/quic/mcp; only the `web`-featured CLI pulls it (and Tokio).
ikigai-web = { path = "crates/ikigai-web", version = "0.1.27" }
futures = "0.3"
# Turtle parsing for the engine's plan face — reading a stored `ik:Process` graph back.
# Default features only: no tokio, so `ikigai-engine` still compiles to wasm. oxttl pins
# `oxrdf = "=0.3.4"` and re-exports none of its types, so the oxrdf pin is that version
# exactly — a looser one would resolve a second oxrdf that oxttl's triples are not from.
oxttl = "0.2.4"
oxrdf = "0.3.4"
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` an IndexMap instead of a BTreeMap, so a JSON
# object serializes in the order its keys were INSERTED rather than alphabetically. Every
# crate here that projects a declared contract into JSON — ikigai-web's OpenAPI
# `?description`, ikigai-mcp's tool `inputSchema` — builds `properties` by iterating the
# endpoint's `inputs` in declaration order, and without this feature that order was thrown
# away at serialization. The visible cost was a booking form that rendered a textarea
# between the two time boxes its author had declared adjacently, while one of their labels
# said "put it in both boxes". The author's order IS the intended reading order; nothing
# downstream can recover it once it is sorted, and no naming discipline should be needed to
# keep it. Note for anyone reading a diff of JSON this workspace emits: `Map::remove` is
# `swap_remove` under this feature — reach for `shift_remove` where order is meant to hold.
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1", features = ["use-std"] }
libc = "0.2"
# Native HTTP client for the embedded host's ikigai-http transport. Blocking and
# runtime-free, so it works under the CLI's `futures::block_on` without pulling Tokio.
ureq = "2"

