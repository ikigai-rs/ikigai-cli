# ── Intra-workspace siblings: LOCKSTEP pins, not floors ───────────────────────
# The fifteen members that take `version.workspace = true` are released TOGETHER, at one
# version, always. So every sibling pin below states the CURRENT workspace version rather
# than the oldest published sibling whose API is actually called.
#
# This does not break "a pin states the true minimum API you use" (constitution rule 5) —
# it is that rule applied to a set that ships as a unit, so please do not "fix" it back.
# A floor lets cargo resolve `ikigai-cli 0.1.17` against `ikigai-ipc 0.1.16`: a combination
# NOTHING HAS EVER BUILT. In-tree the path dependency always wins, so the version half is
# never exercised here; off-tree, same-version-across-the-set is the only combination that
# has ever been packaged, published or tested. For a lockstep set the lockstep version IS
# the true minimum — the floor is not a weaker claim than it, it is a DIFFERENT and untested
# one. And it was reachable, not theoretical: `just release ikigai-cli` reported READY while
# ipc, quic, wire and embedded were still at 0.1.16, with nothing to stop a cli 0.1.17
# shipping against 0.1.16 siblings.
#
# The per-pin notes are kept as API HISTORY: they record which release first carried the API
# named, which is what a reader needs when asking whether an older sibling would compile at
# all. They no longer set the number.
#
# ⚠ Consequence for the release ritual: a lockstep bump now edits SIXTEEN sibling pins
# across four manifests (this one, crates/ikigai-cli, crates/ikigai-embedded,
# crates/ikigai-p2p) on top of `workspace.package.version`.
# `crates/ikigai-cli/tests/lockstep_pins.rs` is what makes those sixteen non-optional rather
# than remembered — the drift that produced this defect ran for eight releases and the only
# thing that ever noticed was a comment.
#
# `ikigai-time` is the ONE exception; its own note below says why.

# The org⊕calendar consolidated-view (Brian-Busy) derivation — a composition crate
# that reconciles personal/org/rdf THROUGH the kernel. Published since 0.1.14 (#296):
# ikigai-embedded depends on it, and a path-only dependency makes every crate above it
# in this workspace unpublishable, the `ikigai` binary included.
ikigai-view = { path = "crates/ikigai-view", version = "0.2.8" }
