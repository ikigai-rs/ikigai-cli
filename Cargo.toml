# 0.1.55 was A SCRIPTED SESSION CACHES WHAT IT ASKED FOR, AND A LAYER DOOR OFFERS NO VALIDATOR.
# Stacked on 0.1.54, which was already on crates.io; nothing unpublished sat beneath it.
