#   additive): a probe beside the deferred reader that answers without reading. ⚠ Behavior: an
#   empty stdin is no VALUE, so a source stage left with one required argument goes without it
#   (refused as missing) instead of receiving an empty string; a sink still reads an empty body.
#   An idle pipe (writer open, nothing yet) is consulted as before.
# - `ikigai --quiet`: the line REPL with no banner, no topology lines, and no prompt when stdin
#   is not a terminal, so a piped session replays cleanly (PR #466, ledger #1310).
# - SECURITY POSTURE (PR #467, ledger #1295): a `serve quic://` layer door binds the layer space
#   alone. ikigai-layers 0.2.1+ validates every write inside the host, so `urn:shacl:validate`
#   (which declares no capability) is no longer offered to every participant. The layers pin
