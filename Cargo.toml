# - ikigai-quic: a QUIC session carries a PRINCIPAL, stamped on every request (ledger #879).
#   `Session` gains `principal: Option<String>`, an IRI the minter derives from the peer
#   certificate; `dispatch` puts it on every call (Issue, IssueAs, IssueTraced and IsCached, every
#   verb) as the inline argument `principal` (`ikigai_quic::PRINCIPAL_ARG`), the name ikigai-web
#   stamps on a write, and removes whatever a client sent under that name first. It is never
