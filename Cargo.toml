# 0.3.1 = core 0.2.0 sweep (ledger #2356): the newest release, on ikigai-core 0.2.x. `"0.3.1"` is `<0.4.0`. Beneath it: 0.2.21.
ikigai-store = { version = "0.3.1", features = ["persistent"] }
