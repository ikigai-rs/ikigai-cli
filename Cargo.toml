#   mount dropped it and the peer saw no deadline. The retry count stops at the door (serve sets no
#   retry budget), and a spent deadline is answered, not refused. ikigai-python's and ikigai-deno's
#   pinned real-door tests see `left=<about 10>` where they saw `left=none` (ledger #1991).
