# Outbound email (urn:email:send): a cap-gated Sink submitting over SMTP to a local MTA
# that relays onward. Published since 0.1.14 (#296); the contact service and the
# scheduling confirm-link both need it.
ikigai-email = { path = "crates/ikigai-email", version = "0.2.8" }
# Public form intake (urn:*:submit): parse an untrusted urlencoded/JSON body, validate
# declared fields, drop an escaped s-expr tuple into a space. Contact + booking share it.
# API history — 0.1.17 = `IntakeField::max_len` and `IntakeField::legacy` (#300, the bounded
# booking door). That was the API floor, and for one release it coincided with the lockstep
# version; the pin above now states the lockstep version, which is at or above it.
# A HARD floor, and one the workspace build cannot see: inside this tree the path
# dep always wins, so `cargo test` is green against a pin that no published version
# satisfies. It surfaces only when a member is PACKAGED, where the path is stripped and
# the caret resolves against the registry — `^0.1.14` picked the live 0.1.16, which
# predates both methods, and ikigai-embedded failed to verify with four E0599s. Nothing
# else catches this: the gates pass, CI passes, and the break waits for release day.
ikigai-intake = { path = "crates/ikigai-intake", version = "0.2.8" }
# WebAuthn (ES256) assertion verifier: the second factor gating the edge decision links.
ikigai-passkey = { path = "crates/ikigai-passkey", version = "0.2.8" }
# Sibling workspace crates pinned to the current release: a published crate requires
# its siblings at this version too, so ANY subset of the workspace can publish in
# dependency order (wire → ipc → … → cli) and a crate never builds against an
# older, incompatible sibling on crates.io. ⚠ That lockstep is a property of the TREE
# — `crates/ikigai-cli/tests/lockstep_pins.rs` enforces it here — and says nothing
# about the REGISTRY, which only matches the tree after a full wave. The two parted for
# weeks without anything saying so (ledger #494); `registry-drift` is what says so now.
ikigai-wire = { path = "crates/ikigai-wire", version = "0.2.8" } # v6 hello + ErrorTyped/WireError
# API history — 0.1.16 = `Spawner::width()`: the scheduler answers how many tasks make progress AT ONCE
# (1 for `single`), which is what the engine's fan-out routing sizes itself by. Core
# defaults that method to `None` = unknown, and a caller reading unknown as "wide" is the
# ~1.8x-slower case — so below this floor the routing is silently inert, not merely older.
# API history — 0.1.15 = SchedulerSpec: a spec parsed WITHOUT building, so `--scheduler pool:xyz` is
# rejected while argv is read instead of by spawning a threadpool to find out.
ikigai-scheduler = { path = "crates/ikigai-scheduler", version = "0.2.8" }
# ⚠⚠ EXEMPT from the lockstep above — deliberately, and this pin must NOT be raised to the
# workspace version. ikigai-time is the sixteenth member and the only one that does not take
# `version.workspace = true`: it declares its own `version` in its own manifest and is
# published on its own line, because the Clock change below was a BREAKING API change that
# earned a major bump the other fifteen had no reason to take (and 0.3.0 and 0.4.0 took
# two more). That line's version is therefore its current release; `0.1.17` would name a version of ikigai-time that does not exist on
# crates.io and never will. That one, unlike a stale floor, is loud: cargo checks a path
# dependency's declared version against the requirement, so `0.1.17` here stops the whole
# workspace resolving ("candidate versions found which didn't match: 0.2.0") before anything
# compiles. It is exactly the asymmetry that let the floors rot unseen — a requirement too
# HIGH fails immediately, a requirement too LOW is satisfied by the path dep and says nothing.
# The exemption is encoded BY NAME in `crates/ikigai-cli/tests/lockstep_pins.rs`, which
# checks this pin against ikigai-time's own declared version — so the two cannot drift, and
# if ikigai-time ever rejoins the lockstep the test says to delete the exemption.
# 0.4.0 = a job fires under the capability that SCHEDULED it, clamped to the registry's
# ceiling, instead of the registry's root (ledger #79). `schedule`/`schedule_persistent` take a
# required `capability`, so ikigai-embedded's four host jobs now name theirs
# (`host_job_authority`), and `urn:time:*` declares `urn:cap:time:{schedule,cancel,read}`. A
# hard floor, and a security one: every 0.3.x fires every job at root.
# 0.3.0 = `JobHealth` gains `last_success`, `since_last_success` and `failures_in_a_row`,
# and `JobRegistry::with_sleep_clock` takes the host's `Arc<dyn SleepClock>` (#334). Public
# STRUCT FIELDS, so anyone constructing a `JobHealth` literal breaks — a major bump under
# 0.x, the same reason 0.2.0 took one. ikigai-embedded reads all three fields and installs
# `HostSleepClock`, so this is a hard floor here.
# 0.2.0 = `JobRegistry::new` takes the host's `Arc<dyn Clock>`. A hard floor, not a
# preference: 0.1.x stamps `last_run` with `std::time::Instant::now()`, which panics on
# wasm32-unknown-unknown under the registry lock and bricks the registry for the life of
# the process. (0.1.12 gave the older need: JobHealth::last_run for staleness.)
ikigai-time = { path = "crates/ikigai-time", version = "0.5.0" }
# Inbound HTTP transport (method↔verb, path↔iri, cap-per-request). A published
# transport like ipc/quic/mcp; only the `web`-featured CLI pulls it (and Tokio).
ikigai-web = { path = "crates/ikigai-web", version = "0.2.8" }
futures = "0.3"
# Turtle parsing for the engine's plan face — reading a stored `ik:Process` graph back.
# Default features only: no tokio, so `ikigai-engine` still compiles to wasm. oxttl pins
# `oxrdf = "=0.3.4"` and re-exports none of its types, so the oxrdf pin is that version
# exactly — a looser one would resolve a second oxrdf that oxttl's triples are not from.
oxttl = "0.2.4"
oxrdf = "0.3.4"
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `serde_json::Map` an IndexMap instead of a BTreeMap, so a JSON
# object serializes in the order its keys were INSERTED rather than alphabetically. Every
# crate here that projects a declared contract into JSON — ikigai-web's OpenAPI
# `?description`, ikigai-mcp's tool `inputSchema` — builds `properties` by iterating the
# endpoint's `inputs` in declaration order, and without this feature that order was thrown
# away at serialization. The visible cost was a booking form that rendered a textarea
# between the two time boxes its author had declared adjacently, while one of their labels
# said "put it in both boxes". The author's order IS the intended reading order; nothing
# downstream can recover it once it is sorted, and no naming discipline should be needed to
# keep it. Note for anyone reading a diff of JSON this workspace emits: `Map::remove` is
# `swap_remove` under this feature — reach for `shift_remove` where order is meant to hold.
serde_json = { version = "1", features = ["preserve_order"] }
postcard = { version = "1", features = ["use-std"] }
libc = "0.2"
# The peer-credential reads (`SO_PEERCRED`, `getpeereid`) and the user and group lookups of the
# socket door's per-UID admission (ledger #2139), through a vetted crate rather than our own FFI.
# 0.30.1 is already in the graph; `socket` and `user` are the two features ikigai-ipc reads.
nix = { version = "0.30.1", default-features = false, features = ["socket", "user"] }
# Native HTTP client for the embedded host's ikigai-http transport. Blocking and
# runtime-free, so it works under the CLI's `futures::block_on` without pulling Tokio.
ureq = "2"


# ── Profiles ──────────────────────────────────────────────────────────────────
# Steel's engine build is the cost of every Lisp door, reactor tick and `(…)` in the REPL, and
# steel-core 0.8.3 (through ikigai-lisp 0.3.1's `=0.8.3` pin) roughly DOUBLED it; in an
# UNOPTIMIZED debug build that is ~2.4x (ledger #1100: `urn:lisp:eval` of `(+ 1 2)` ~0.42 s ->
# ~0.97 s). Optimizing that ONE package in dev builds takes it back below where 0.8.2 was, and
# changes nothing in release (already optimized) or in this workspace's own code's debuggability.
# Measured here on cli main a82c4e1: four back-to-back `(+ 1 2)` evals in one `ikigai --plain`
# process, see the PR that added this. The stanza is per CONSUMING workspace (a profile in a
# dependency's manifest is ignored), so every workspace that builds Steel in debug carries it;
# ikigai-programs does (ikigai-programs PR #40).
[profile.dev.package.steel-core]
opt-level = 3
