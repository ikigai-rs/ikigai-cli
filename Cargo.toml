# 0.1.42 was THE HOST DECIDES WHAT EACH REACTIVE SPACE FIRES, AND retry= NEEDS ITS OWN GRANT.
# - ikigai-embedded: the HOST decides what each reactive space fires (ledger #887, the wiring
#   the 0.1.41 `with_host_handler` seam left open). A space's `handler` file sits in the drop
#   tree, so whoever could write the workspace chose which bound IRI every tuple fired at, under
#   the authority the host granted that space; reproduced on 0.1.41 with a real kernel (the
#   retargeted IRI ran and its answer landed in `outbox/`). The writer now reads
#   `<config home>/space-handler/<space>` (one IRI; `#` comments allowed), beside
#   `space-authority/<space>`, per tuple. Host entry present: it fires, and a `handler` file
#   naming something else is REFUSED (dead-lettered, loud). Host entry invalid (no IRI, several,
#   not an IRI, unreadable): nothing fires. Host entry absent and a `handler` file present: the
#   MIGRATION FALLBACK, today's behavior, named at start-up with the exact `cp` that pins it and
#   logged on the first tuple each such space fires. Operator-visible: new start-up lines
#   `ikigai: space `<s>`: fires … ABSENT …` / `… REFUSED …`; until a space is pinned its file
#   still decides. The heartbeat counts a pinned space's dead letters even with no `handler`
#   file.
# - ikigai-intray: `dead_letters_of(root, spaces)` (additive): the dead-letter report for the
#   spaces a host names, for a host that decides reactivity itself.
# - ⚠ ikigai-intray: `retry=` needs `urn:cap:space:retry` (new `CAP_RETRY`) beside
#   `urn:cap:space:out` (ledger #887 item 4). It needed only `out`, the authority a stranger
#   drops under, so anyone who could drop could re-arm a dead letter the reactor parked ON
#   PURPOSE: an interrupted pass the default policy refused to run twice (a booking whose mail may
#   have gone), or a handler the host refused. Reproduced on 0.1.41 (an `out`-only `retry`
#   succeeded). Checked before the tree is read, so a denied caller learns nothing about which
#   ids are dead letters. The Sink's declared `requires` stays `out` (a plain drop must not need
#   the new scope; core has no per-input `requires`), so the `retry` input's summary names it.
#   Operator-visible: a non-root caller that used `retry=` now needs the grant; the REPL's root
#   capability holds it, and no reactive handler does by default.
# - ikigai-intray: the dead-letter hook runs AFTER the reactor releases its own locks (ledger
#   #887 item 6). It ran under the pass lock in every `process`, in the periodic recovery sweep,
#   and inside the startup recovery's `OnceLock` initializer, so a hook that drove the same
#   reactor (`drain`, `process`, `sweep_interrupted`) deadlocked; all three paths reproduced
#   (bounded tests, `tests/hook_reentry.rs`). No host's hook did that yet. Hook order and
#   arguments are unchanged; it still runs synchronously on the settling thread.
#
# 0.1.41 was THE INTRAY AUDIT FIXES, A QUIC PRINCIPAL THAT SURVIVES NARROWING, AND ikigai-llm 0.13.
# - ikigai-llm 0.13.0 (ledger #884, a MINOR: llm.json entries and requests 0.12 accepted are now
#   refused, and this host falls back to its built-in registry when llm.json fails to parse, so
#   check `source urn:llm:config` after installing): network grants honor the port, the API key
#   goes on every request, user:password in a base_url is redacted on every face, answers that
#   asked a live server are not cached forever, and urn:llm:select requires a net grant and
#   reports only backends the caller can reach.
# - ikigai-intray: a `match=` template may not contain `SERVICE` (audit round 5, ledger #877). A
#   SPARQL ASK carrying `SERVICE <http://…>` made the host open an outbound connection to an
#   address of the caller's choosing under nothing but `urn:cap:space:read` (rd) or
#   `urn:cap:space:take` (take, which could ship the tuple's own triples there) — oxigraph's HTTP
#   client is on in the host build by feature unification through rudof. Reach: the edge QUIC
#   door grants enrolled peers space:read/take, and every reactive handler holds both. Now the
#   template is parsed to algebra and a `SERVICE` anywhere in it (including `FILTER EXISTS`,
#   `OPTIONAL`, sub-selects) is a typed `InvalidArgument` on `match`, and evaluation runs with a
#   service handler that refuses every call whatever features the build has. A `match=` is also
#   no longer executed once against an empty store to check its shape; the shape is read off
#   the parse. Operator-visible: a template that used `SERVICE` (none is known) now fails.
# - ikigai-intray: `delete urn:space:q <id>` takes THAT tuple (ledger #877). The engine puts a
#   delete's trailing or piped value in `content`, which take neither declared nor read, so the
#   request fell through to the work-queue pop and consumed the first tuple in id order instead.
#   Take now declares `content` and reads it as the id (trimmed; empty = not given, since the
#   engine sends an empty `content` on every bare delete); `tuple=` and `content` naming different
#   tuples is refused. And every selector (`tuple=`, `match=`, `state=`, `retry=`) that is present
#   but not UTF-8 is a typed `InvalidArgument` rather than read as absent: a non-UTF-8 `tuple=` on
#   take was likewise a pop, and a non-UTF-8 `state=` silently read the inbox.
# - ikigai-intray: one staging file per writer, and no reader trusts a tuple it has not hashed
#   (ledger #877). Every drop of a tuple staged through `.dropping/<id>.tuple` and every take
#   through `.taking/<id>.tuple`, so identical concurrent drops failed spuriously and could
#   publish a TORN tuple (a later O_TRUNC write into the inode being renamed), and a take that won
#   its claim could fail its read and lose the tuple. Staging names are now unique per writer
#   (`<id>.<millis>.<pid>.<n>.drop|claim`); rd, match, take and the reactor check the blake3 id
#   before trusting bytes, and a file that fails it is dead-lettered into `error/` with a
#   `corrupt:` note (rd by id refuses it and leaves it). A take whose read fails puts the tuple
#   back. A claim abandoned in `.taking/` for 5 minutes (a taker that died mid-take) goes back to
#   the inbox at the space's next rd or take; before, nothing showed or recovered it.
#   Operator-visible: `.dropping/` and `.taking/` file names change shape; a tuple placed in an
#   inbox by hand under a name that is not its blake3 hash is now dead-lettered, not delivered.
# - ikigai-intray's reactor (ledger #877). `watch()` establishes the watch BEFORE the startup
#   catch-up, so a tuple dropped during the catch-up (a handler composing a follow-up) is handled
#   rather than left until the next restart; on main `watch()` returned before the watch even
#   existed. It creates the root before canonicalizing it (a watch over a root that did not exist
#   yet never fired on macOS). A watch that cannot start, a watch error, and a watcher that stops
#   are LOGGED to stderr instead of ending a thread silently, and `try_watch()` returns the reason
#   for a host that would rather refuse to start. Every 60 s without an event (`SWEEP_EVERY`) the
#   loop re-runs recovery and the catch-up. Passes are serialized per reactor.
#   Recovery (Hermes audit): `recover_interrupted` ran once per reactor, so a tuple a crashed
#   sibling left in `.processing/` stranded while any other reactor lived; now `drain` and the
#   watch loop also sweep (`sweep_interrupted()`), recovering when this reactor is the only live
#   one over the root. ⚠ With three or more reactors a crashed one's tuples still wait until one
#   is left (per-claim ownership is reported up).
#   Re-drop semantics, decided and documented: an identical drop while pending is a no-op; after
#   the tuple has settled it is a NEW request and fires again (gonk's review queue relies on it).
#   A tuple's record is now its LAST pass: a success clears a stale `error/` entry (so
#   `dead_letters` and the heartbeat's FAILING line stop reporting a handled tuple), a failure
#   clears a stale `outbox/` entry, and a pass that answers nothing removes an earlier `.out`.
#   Operator-visible: stderr lines prefixed `ikigai-intray:` from the edge's and the daemon's
#   reactors; a re-dropped tuple that once failed and now succeeds leaves `error/`.
# - ikigai-intray: `SpaceReactor::with_host_handler` (additive; Hermes audit, ledger #877, the
#   class of ledger #445). A space's `handler` file sits in the drop tree, so whoever can write the
#   tree chooses which IRI every tuple fires at, under the reactor's host-granted authority, even
#   with `with_host_authority` installed. The seam hands the host the space and the file's target;
#   the host fires its own IRI, passes an allowed one through, or refuses (the tuple is
