# 0.1.63 was THE CONFORMANCE 0.8 WAVE, ARGUMENT HELP, THE SPAM FILTER AND ONE-SPACE READS.
# Stacked on 0.1.62, which was already on crates.io; nothing unpublished sits beneath it.
# A patch: every API change below is additive, and no consumer has to adapt.
# - PR #497 (the 2026-10-14 conformance wave): `urn:tz:convert` with neither `in` nor a piped
#   `content` is refused as a typed `MissingArgument("in")`, and a present but unreadable `in`
#   as `InvalidArgument` naming `in` (it used to fall through to `content`, untyped). Every
#   member's `ikigai-conformance` dev-dependency moves to 0.8.0; `host-arrangement` is declared
#   pure; `calendar-request` / `contact-block` waive REQUIRED and AUTHORITY with written reasons.
# - PR #498: lock only, core 0.1.103, vocab 0.1.103, xslt 0.3.1, conformance 0.8.1. Manifest
#   floors unchanged.
# - PR #499 (ledger #1499): when a request fails with `MissingArgument`/`InvalidArgument`, the
#   engine reads the target's contract and appends the input's summary (accepted values for an
#   enumeration, a pipe hint for a missing value a pipe would fill) under the unchanged first
#   line. No JSON Meta renderer: the message stays byte-identical. Core's `Display` and the wire
#   form are untouched.
# - PR #500 (ledger #1512): `ikigai-bayes` 0.1.0 bound in the LOCAL root only, when armed with
#   `--bayes-state` + `--bayes-model` (or the config home's `bayes.*` keys); one open per
#   process; never in `served_space`. New `ikigai_embedded::bayes` module. `serve --http`,
#   `serve quic://` and `--connect` refuse the flags by name.
# - PR #501 (ledger #1513): spam-filter label links, `urn:contactlabel:link` (daemon) and
