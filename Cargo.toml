#   the variable; a variable inside a segment is refused by name. The schema is unchanged (the
#   argument stays optional, as the contract declares). Surveyed: the optional bindings in the
#   ecosystem are ledger `{ledger}` (default `default`), browse annotation `{id}` (bare = mint),
#   a11y `{app}` and browse `{path}` (a concrete row or the bare spelling serves the omission).
# - ikigai-core 0.1.86 (ledger #874, the cli part of ledger #858): the workspace pin rises to
#   "0.1.86" as a SAFETY floor, and the lock moves 0.1.85 -> 0.1.86 (one package; the other 47
#   lock edges are the same core pointer). Through 0.1.85 `attenuate`/`clamp` dropped a deny scope,
#   so a tenant grant of the workspace minus a directory, narrowed by a delegate or clamped by a
#   carried capability at the QUIC door, read the excluded directory.
#   `a_localized_tenant_deny_survives_attenuate_and_clamp` (ikigai-embedded) is red on 0.1.85.
# - ikigai-embedded: a NEW workspace is created 0700 (ledger #868). `file_root()` used
#   `create_dir_all`, which follows the umask, so a fresh install under `umask 002` got a 0775
#   `~/.ikigai/workspace` (or `$IKIGAI_FILES`) and the passkey directory check (ledger #850) refused
#   it at `serve --http` startup. The leaf is now created with mode 0700 and set to exactly that;
#   an EXISTING directory is untouched (the #850 check judges it and names the fix). Missing
#   parents still follow the umask. Operator-visible: only on a first run.
#
# 0.1.40 was SECURITY FLOORS FROM AUDIT ROUND 3, A RESOLVER THAT FAILS CLOSED, AND A PASSKEY STORE
# ONLY ITS OWNER COULD HAVE WRITTEN.
# - Security floors (PR #408): ikigai-fs 0.1.8 (the jail authorizes the file it opens: no
#   symlinks, canonical spellings only, fails closed on a missing root; an undeclared `as` is
#   refused), ikigai-sign 0.2.3 (ES256 high-S refused, one signature per graph), ikigai-encrypt
#   0.1.2 (a low-order recipient no longer panics the host), ikigai-secret 0.1.7 (injective file
#   names, 0600 atomic writes, generate needs write authority). Ledger #853, #854, #856, #857.
# - A resolver that cannot carry a capability REFUSES it (ledger #849). `Resolver::issue_as`
#   defaulted to dropping the capability and calling `issue`, so a wrapper overriding only `issue`
#   resolved its callers as the peer's default authority, root (ikigai-web's prefer mount did,
#   fixed in ikigai-rs/ikigai-web PR 19). The default now serves root through `issue` and refuses
#   any other capability with a typed `Denied` naming the type. Downstream: a `Resolver` impl
#   that overrides only `issue` and is driven under a narrowed capability (a mount wrapper, a test
#   double, a scheduler resolver) now gets `Denied` and must forward the capability in `issue_as`.
# - The passkey store is trusted only if nobody else could have written it (ledger #828; write
#   access to it is the power to enroll a credential). A credentials file enrolled before 0.1.39
#   is 0664 under umask 002, and 0.1.39's 0600 save never rewrites it for a platform passkey
#   (its counter stays 0). Now every load (the gate, `urn:passkey:challenge`,
#   `urn:passkey:register`, `is_enrolled`) checks the open file under the credential lock:
#   group/world-WRITABLE, or owned by another user, refuses exactly like an unparsable file;
#   group/world-READABLE only is tightened to 0600 and logged once. Unix only (no mode bits
#   elsewhere). `serve --http` runs the same check at startup.
# ⚠ DEPLOY NOTE: an edge whose `passkey-credentials.json` is group- or world-writable REFUSES TO
#   START `serve --http` (exit 2, the file and `chmod 600 <path>` on stderr) until a person at the
#   box checks the entries are theirs and runs that chmod. The QUIC and IPC doors still start,
#   and their passkey-gated decisions refuse until it is fixed. A readable-only file is fixed
#   silently but for one log line. ⚠ The startup check is the WHOLE load, so a corrupt or
#   unreadable store now also stops `serve --http` from starting (0.1.39 started and refused
#   every decision). Check the edge's file mode BEFORE installing:
#   `ls -l ~/.ikigai/workspace/passkey-credentials.json`.
# - The enrollment window and the workspace are judged like the store (ledger #850).
#   `urn:passkey:enroll-open` wrote `passkey-enroll.open` with `fs::write` (0664 under umask 002),
#   a window that expires unused stays on disk, and `enrollment_open()` read it with no mode or
#   owner check, so anyone who could write it could put a future timestamp in it and register a
#   credential through the public face without `urn:cap:passkey:enroll`. Now the window is written
#   0600 (atomic), and a window file that is group/world-writable or owned by another user keeps
#   enrollment CLOSED (logged with `rm <path>`; never chmod it, the timestamp is not yours);
#   readable-only is tightened. The workspace DIRECTORY is judged first on every passkey load: a
#   directory others can write (or owned by another user) refuses every passkey-gated decision,
#   enrollment and `serve --http` startup, ABSENT store included, because deleting the store is
#   how someone with write access to the directory would disarm the gate.
# ⚠ DEPLOY NOTE: an edge whose workspace (`$IKIGAI_FILES`, else `~/.ikigai/workspace`) is group- or
#   world-writable REFUSES TO START `serve --http` (exit 2, the directory and `chmod go-w <dir>` on
#   stderr), WHETHER OR NOT a passkey is enrolled, until a person at the box checks the passkey
#   files in it are theirs and runs that chmod. Check BEFORE installing:
#   `ls -ld ~/.ikigai/workspace ~/.ikigai/workspace/passkey-*` (want `drwxr-xr-x` or tighter and the
#   service user as owner; a leftover `passkey-enroll.open` can simply be removed).
#
# 0.1.39 was THE PASSKEY GATE FAILS CLOSED; core 0.1.85, store 0.2.6, ledger 0.4.0.
# ⚠ DEPLOY STEP (ledger #794): install 0.1.39 on the edge and, IN THE SAME DEPLOY, add
# `--passkey-rp-id ikigai-rs.dev` to `ikigai-edge-http`'s ExecStart
# (ikigai-devtools/services/edge/linux/ikigai-edge-http.service). Never before (an older ikigai
# refuses the unknown flag and the edge goes down); never omitted after (0.1.39 has NO default
# relying party, so with a passkey enrolled every gated decision is refused). Update
# services/edge/README.md "The passkey second factor" in the same change, then check whether a
# passkey is enrolled on the edge (a corrupt credentials file now refuses instead of opening).
# ikigai-edge-quic and ikigai-edge-contact need nothing.
# - The passkey gate fails closed (PR #401, ledger #787): an absent credential file still means
#   not enrolled; a present file that cannot be read or parsed refuses every gated decision,
#   errors the challenge, refuses registration and logs the file. Saves are atomic (0600 temp,
#   fsync, rename, fsync dir); one process-wide lock covers load -> verify -> save, so the
#   counter never goes down; the relying party comes from `serve --passkey-rp-id <domain>
#   [--passkey-origin <url>]`, checked at startup, with no default (it silently defaulted to
#   ikigai-rs.dev from env vars); challenges expire on the monotonic clock.
# - rustls 0.23.45 (RUSTSEC-2026-0285, ledger #796; PR #402).
# - ikigai-core 0.1.85 (PR #403): the capability floor covers every verb, so a host endpoint
#   asked for a verb it does not declare is refused unless the caller holds what it declares;
#   under a narrowed capability the urn:time:* endpoints could be driven through an undeclared
#   verb (a Delete on urn:time:schedule registered a job under no grants).
# - ikigai-store 0.2.6 / ikigai-ledger 0.4.0 (PR #403): `store::grants_for(L, Purge)` carries
#   `urn:cap:store:read:graph:urn:iki:ledger:graph:L:deleted` (eight tokens; purge reads the
#   graveyard; ledger #760). Operators: add that token to any grant file or --cap list that
#   grants purge. The ledger gains a keyed append and a JSON face.
#
# 0.1.38 was DOORS THAT STAY OPEN (ledger #720). One accept error no longer ends a door: ikigai-web's
# HTTP listener and ikigai-ipc's socket door classify accept errors. A per-connection error
# (ECONNABORTED, EPROTO, a reset) is logged and the loop continues; resource exhaustion (EMFILE,
# ENFILE, ENOBUFS, ENOMEM) backs off 10ms -> 1s and retries, logged once per episode. Before, one
# EMFILE under launchd's default 256-fd limit ended gonk's door. And ikigai-quic gains a tripwire
# test on quinn's receive-error handling (ledger #752: not reachable on quinn 0.11; it goes red
# when quinn surfaces those errors, which is when serve_with needs a rebind path).
#
# 0.1.37 was ATTENUATION THAT SURVIVES (ledger #734). Every QUIC call carries the caller's capability
# and the server answers at the narrower of it and the connection's authority, so a narrowed
# `--connect` session, an MCP agent's grant or a scheduler's cap is narrowed at the peer too (no wire
# version bump: every ikigai-quic since 0.1.18 answers IssueAs). And `cap seal` makes hand-off
# explicit: an engine has a FLOOR (root for `Engine::new`, the starting identity for
# `with_identity`) that `cap reset`, `login` and `logout` cannot rise above, lowered only by a seal.
# Plain `cap` stays reversible, so the runbook's, tutorial's and web-demo's narrow/reset are unchanged.
# And ikigai-web route variables are STRICT (ledger #740): `{var}` refuses a value carrying
# `: / ? # [ ] @` (raw or percent-encoded) with a final 400, so `/u/alice:private` can no longer
# reach an unrouted IRI under `routes_only`; `{+var}` opts in to raw values (gonk's browse door).
#
# 0.1.36 was THE SECURITY RELEASE from the review-value experiment (ledger #723, #733, #741, #738).
#
# 0.2.7: SCRIPTS, MAPPED FORKS AND STREAMED UPLOADS (ledger #2649, #2654, #2454). Operators, read the
# second item: it is the behavior change.
# - `.iki` scripts (PR 617, ledger #2649): `ikigai <file>.iki [key=value]`, `--script`, a shebang
#   (`#!/usr/bin/env -S ikigai --quiet --script`) and the REPL's `script <iri>`. Answers stream line by
#   line; a failure stops at its line (`error: line N:`, exit 1), and a refused parameter exits 2 first.
# - engine 0.2.11 (ledger #2653-#2656): stored plans gain the mapped fork (`ik:mapOver`, each item its own
#   request), the fork as a branch and a fork that binds a name. ⚠ A stored plan whose result does not
#   depend on one of its Sink or Delete steps now FAILS validation, naming the step, instead of running
#   without it; an unreached read is a warning. Unsupported stored fork properties are refused.
# - Uploads stream end to end on the socket and QUIC doors (PR 615, ledger #2454); the HTTP door's
#   in-memory intake keeps one buffer (a 1 GiB upload's peak memory fell 29%), and its pre-admission
#   413 is a negotiated page with the edge's headers, before any identity or host hook (PR 618).
# - Names: `serve --http … --names <file>` serves a names file (PR 613, ledger #2516), and names-file
#   writes and reloads are serialized, so a burst cannot install a binding twice (PR 616).
# - `ikigai-compress` is bound in the local root, so the runbook's Bytes tab runs (PR 614). A mount's
#   reads are uncacheable here by rule, and `urn:kernel:uncached` says so (PR 609, ledger #2613).
# - ikigai-fn 0.8.0 and ikigai-personal 0.8.1 (PR 610); the lock holds browse 0.20.2, diagram 0.3.1 and
#   runbook 0.3.1 on that one ikigai-fn (PR 611).
# A deploy change: rebuild --locked.
#
# 0.2.6: NAMES AND REVALIDATION (ledger #2515, #2535, #2553). Operators, read the third item: it is the
# behavior change.
# - The names layer (PR 606, ledger #2515): the config home's `names` (or `names.ttl`, or `--names <file>`)
#   binds named requests LAST in the REPL's root. `bind` / `unbind` persist into it, an edit to the file
#   rebinds live, and an edit to a file a binding references recomputes it. `urn:iki:host:names` reads the
#   table; its Sink declares `urn:cap:host:write:names`, so a narrowed session is not offered the write. The
#   status door `urn:iki:space:dynamic:names:status` names a binding that a served name shadows. A config
#   home holding BOTH `names` and `names.ttl` refuses to start (exit 2) rather than pick one.
# - `urn:http:get` revalidates (http 0.5.0 on core 0.2.7, ledger #2535, #2553): an answer with an `ETag` or
#   `Last-Modified` and no lifetime (`no-cache`, `max-age=0`, or none at all) is kept, the next read sends
#   `If-None-Match` / `If-Modified-Since`, and a 304 serves the stored body. A feed that sends only an ETag
#   is no longer downloaded whole on every read.
# - fs 0.3.0: a directory also answers `as=text/uri-list` (full `urn:file:` names, so a map can source each
#   child), and a path takes exactly ONE canonical percent-encoding on every verb: uppercase escapes, with
#   unreserved ASCII and `/` literal. A file whose name holds a literal `%20` is now `%2520`, and a raw
#   Unicode spelling must be UTF-8 escapes; encoded separators and alternate spellings are refused.
# - ledger 0.14.0 (close timestamps, daily counts); llm 0.18.0 and meeting 0.6.0 on http 0.5.0's shared
#   `HttpTransport`; the conformance 0.12.0 BODIES checks in this workspace's tests (PR 607).
# The lock moves those ikigai crates and every member onto core 0.2.8; no third-party edge moved. ikigai-personal
# 0.8.0 still links ikigai-http 0.4.3 privately (for `auth::basic`, no http type in its API) until 0.8.1 is out.
# A deploy change: rebuild --locked.
#
# 0.2.5: NAMED-REQUEST PLUMBING, BETTER FILES AND BETTER CACHING UNDERNEATH (a lock move and floors; no cli
# code change). Operators, read the first item: it is the behavior change.
# - An unquoted `key=<iri>` in the REPL now sends a REFERENCE (engine 0.2.5, ledger #2508), which the kernel
#   settles by the target's contract (core 0.2.5, ledger #2511): a by-value input receives the referent's
#   bytes. A line that meant the literal text `<urn:…>` quotes it (`key="<urn:x>"`).
# - Files carry real media types (`.geojson`, `.xml`, `.csv`, …; fs 0.2.4, ledger #2532), and a directory
#   reads as the list of its children (ledger #2524). A map over a list ending in a newline runs no extra
#   item (ledger #2523). `urn:plan:eval` takes named plan parameters (ledger #2507).
# - `urn:http:get` honors `Expires` and a capped heuristic lifetime (http 0.4.3, ledger #2533), and a 304
#   is a typed result, never an empty success (ledger #2531). Core 0.2.6 can revalidate an expired entry
#   through its endpoint (ledger #2534); `urn:http:get` uses it once ikigai-http's step lands (#2535).
# - `urn:iki:fn:html-to-text` (fn 0.7.2), stylesheet parameters (xslt 0.4.1), SPARQL `bindings=`
#   (sparql 0.3.2), Lisp `sort` and `string-split` (lisp 0.4.1), the `(name …)` arrangement form (sexpr
#   0.3.1), and throttle overlays that describe a view by its target (throttle 0.3.1).
# The lock moves those thirteen ikigai crates and adds html5ever's tree; it is HAND-MINIMAL (`cargo update -p`
# flipped the oxigraph stack's thiserror 2 -> 1 and three Windows-crate edges), so no third-party edge moved.
# A deploy change: rebuild --locked.
#
# 0.2.4: THE REPL GRAMMAR KEEPS ITS PROMISES (ledger #2502, #2498, #2484, #2481, #2488). Operators, read
# the first item: it is the one behavior change.
# - A `source` word `key=value` whose key reads as an argument name but is not declared is now REFUSED,
#   naming the declared arguments (ikigai-engine 0.2.3), where it used to be sent as positional text
#   (`toUpper inn=abc` answered `INN=ABC`). A script that relied on the fallback names the argument
#   instead (`in="a=b"`).
# - `compose` takes template arguments by name (`src=… name=Joe`, ikigai-fn 0.7.1).
# - A line-REPL replay exits non-zero when a line fails (PR #599), and the cli exits quietly when a pipe
#   consumer closes stdout (PR #600).
# - THE LOCAL ROOT BINDS `urn:json:*` (ledger #2481, PR #601). ADDITIVE. ikigai-json 0.3.1's
# space (`urn:json:query`, a jq program over any resource read under the caller's capability, and the CSV
# pair `urn:json:from-csv`/`urn:json:to-csv`) is bound in the embedded host's local root, so `-c`, the REPL
# and replays reach it, and so does compose's `$j{<src> <program>}`, which is sugar for `urn:json:query`.
# Until now the binary bound none of it while the book's in-browser kernel did. THE SERVED DOORS DO NOT
# CHANGE (decided at the hub, 2026-10-28): the HTTP door, `--routes-only` and the QUIC served kernels
# serve exactly what they did, under every grant. The two faces that already serve the WHOLE local root,
# the owner's IPC socket (`ikigai serve <sock>`) and `ikigai mcp`, reach the three names as they reach
# every local-root binding, under the caller's ceiling; none declares a capability of its own, and
# `urn:json:query` reads `src` under the caller's. And an unresolved name no longer says "a name newer
# than this build needs an upgrade", which sent a reader to reinstall the binary they had when no release
# bound the name: it says this build binds no such name, and that an upgrade helps only if `cargo search
# ikigai-cli` names a newer release. The lock gains ikigai-json 0.3.1 and jaq.
# Floors: ikigai-engine 0.2.3, ikigai-resolve 0.2.3, ikigai-fn 0.7.1. The release's own lock move takes
# only those three, no other edge; PR #601's added ikigai-json 0.3.1 and jaq. A deploy change: rebuild
# --locked.
#
# 0.2.3: THE HTTP SPACE HONORS `http.max_response_bytes` (ledger #2479, PR #597). A FIX: `urn:http:*` is built
# with ikigai-http 0.4.1's `space_with`, under the same configured byte budget as the native transport, so a
# 12 MiB response under the 16 MiB default is answered instead of refused at the endpoint's own 8 MiB. The
# floor is ikigai-http 0.4.1. The lock moves (hand-minimal, no third-party edge moved): ikigai-core and
# ikigai-vocab 0.2.2 -> 0.2.4 (the cache-key fix, ledger #2473), ikigai-http 0.4.2 (credentials stripped on a
# cross-origin redirect, ledger #2459), ikigai-engine and ikigai-resolve 0.2.2 (pipes carry bodies, ledger
# #2286), ikigai-text 0.4.1 (body-reading inputs, ledger #2468), ikigai-fs 0.2.3 (a piped `sink urn:file:…`
# streams to disk, under a 64 MiB per-root ceiling, ledger #2469, #2493). A deploy change: rebuild --locked.
#
# 0.2.2: THE WEB DOOR STREAMS (ledger #2244, PR #595). ADDITIVE. Answers go through the body path:
# `Content-Length` when the length is known, chunked when not (a producer failure ends with no final
# chunk); `206`/`416`/`If-Range` over a seekable body with a validator (ikigai-http's `range`); small
# bodies (buffers, envelopes, a Replay up to 1 MiB) are served whole as before. Uploads are opt-in via
# `serve_with_uploads`: spilled under a minimum rate (408), 413 past the route or grant, then the Sink
# is issued with `content=b3:…`. Operators, read this first: EVERY ETAG VALUE CHANGES ONCE (one rule
# for every body shape), so each cached answer gets one 200 instead of a 304 after the upgrade; `serve
# --http` spills to `<config home>/spill/http-<port>` (0700); new keys `http.upload`,
# `http.upload_min_rate`, `http.upload_grace`, `http.spill_ceiling`, `http.spill_total`. A deploy change.
#
# 0.2.1: WIRE V10, STREAMED FRAMES ON THE SOCKET AND QUIC (ledger #2242, PR #593). ADDITIVE: `Call`,
# `Reply` and `WireError` are untouched; the frames are new `#[non_exhaustive]` types on appended tags
# 6-9 (head, chunk of at most 256 KiB, end, abort), and `IpcResolver`/`QuicResolver::issue_streamed`
# return a reader. `PROTOCOL_VERSION` is 10, `MIN_PROTOCOL_VERSION` stays 7: a v7-v9 peer never sees a
# frame and gets `Resolved`, or a typed `OverBudget` past one frame (a v8 peer the `Endpoint` text).
# Uploads are collected under 64 MiB (`Limits::with_max_upload`); only answers stream. p2p keeps
# advertising wire 9 (ledger #2452). ⚠ PUBLISH THE WHOLE SET: the version constant lives in
# ikigai-wire and the frame code in ikigai-ipc and ikigai-quic, so wire 0.2.1 beside ipc/quic 0.2.0
# negotiates v10 without frames (a streamed call fails typed, never misread). A deploy change.
#
# 0.2.0: CORE 0.2.0, THE STREAMS RELEASE (ledger #2261, #2356). Every member links ikigai-core 0.2.x, and
# core's types are in their APIs, so this is a breaking change for consumers: the lockstep set moves
# a minor, 0.1.69 -> 0.2.0, and `ikigai-time` 0.4.2 -> 0.5.0. Every ikigai dependency moves to its
# newest release on core 0.2.x (lisp 0.4, text 0.4, layers 0.6, ledger 0.13, store 0.3, sign 0.4, ...),
# and the conformance dev-dependency to 0.11.0 (DATATYPES and FAILURES by default).
# A deploy change: the lock moves the whole ikigai graph. Rebuild --locked.
#
# 0.1.69: THE ONBOARDING LOBBY AT THE QUIC DOOR, NO TLS RESUMPTION, AND INTRAY'S TUPLE CODEC.
# Stacks on 0.1.68, which is already on crates.io. Nothing unpublished sits beneath it. It carries
# PRs #570-#574.
# Operators, read this first:
# - A layer host with a lobby (ikigai-layers 0.4.0, `lobby = true`) now admits a client certificate
#   the door does not trust, to `say` on that lobby and NOTHING else (PR #573, #574, ledger #2009,
#   #2104). A door without a lobby is byte-for-byte as before. The edge needs, for onboarding: the
#   `enroll`/`grants` layer files, `layers.toml [onboard]` with `controller_key`, and `trust_dir` =
#   the door's `<quic cert dir>/clients` (else an approved node is never trusted), and a short
#   lowercase `--name`.
# - TLS session resumption is OFF on every QUIC door (PR #572, ledger #2084), so the client
#   certificate check, its validity window included, runs on every connection.
# - ikigai-intray: a host-supplied tuple codec (PR #570, ledger #2017; the id is the hash of the
#   STORED bytes), match rendering inside the budget and filesystem failures reported (PR #571).
# - The lock moves ikigai-layers 0.3.1 -> 0.4.0, ikigai-encrypt 0.2.1, ikigai-sign 0.3.2 and the
#   oxigraph 0.5.12 parser stack (PR #574). A deploy change: rebuild --locked.
# 0.2.8 adds config-home startup jobs (ledger #2678): explicit instance and scope lists,
# strict line-numbered startup validation, and live replacement of persistent registrations.
# Additive; no public signature or wire format changes. Prepared here, not published.
version = "0.2.8"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-cli"
homepage = "https://github.com/ikigai-rs/ikigai-cli"

[workspace.dependencies]
# The released kernel, consumed from crates.io. For local cross-repo development
# against a sibling checkout, use .cargo/config.toml (see .cargo/config.toml.example).
ikigai-core = "0.2.7" # 0.2.7 = an answer with validators and no lifetime is KEPT for revalidation (ledger #2553), which ikigai-http 0.5.0 asks for as its own floor; the 304 on an ETag-only feed needs it. Beneath it: 0.2.5 = the kernel settles `key=<iri>` references by contract (ledger #2511), which the REPL now sends; a behavior floor. Beneath it: 0.2.0 is the STREAMS release (ledger #2261), taken in the core 0.2.0 sweep (ledger
# #2356): the old `"0.1.108"` meant `<0.2.0` under 0.x rules, so it could never reach it. `"0.2.0"` is a caret
# FLOOR and `<0.3.0`; the lock resolves the newest 0.2.x, since several modules above ask for `^0.2.1`.
# No source here calls an API new in 0.2.x. Beneath it: 0.1.108 = the failure classes (ledger #1546): `FailureClass` and `Error::class()`, the
# `RetryAfter` / `OverBudget` / `Refused` / `Unsupported` variants and `Error::retry_after_millis()`,
# `Verb::is_idempotent()`, `ActionSpec::fails`, and the run context (`IssueContext`, `RetryLimits`,
# `Kernel::issue_with_context` / `issue_traced_with_context`, `Invocation::retry_budget` / `not_after` /
# `time_left` / `issue_context`). An API floor for wire v9 (`ikigai-wire`, `ikigai-ipc`, `ikigai-quic`,
# `ikigai-resolve`) and for the edge's statuses (`ikigai-web`). ⚠ `^0.1.108` is also a ceiling below 0.2.0.
# Beneath it: 0.1.107 = the cache-status probe (`Kernel::is_cached`) keys a served name without
# resolving it, so it no longer forwards a mount's `Meta` to the peer on every resolver read (ledger #1884): a hot
# mounted read through the engine asks the peer for the contract once per TTL again, as ledger #1577's memo meant.
# A behavior floor, not an API floor: no source here calls anything new in it; `ikigai-resolve`'s
# `the_cache_probe_asks_a_mounts_peer_once_per_resolver_read` pins the cost. ⚠ `^0.1.107` is also a ceiling below 0.2.0.
# Beneath it: 0.1.106 = the ArgSpec shape (ledger #1547): input groups with a pipe member, list
# arguments and `ActionSpec::join_repeats`, open and envelope argument sets, `ActionSpec::check` (the one checker),
# declared defaults prefilled by the kernel (by-value and, 0.1.106, optional bindings), and the `to-upper` /
# `reverse-list` builtin rename. An API floor: the engine routes by `pipe_slots` / `excluded_by_groups` and joins
